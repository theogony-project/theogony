id: PHX-0044
category: architecture
priority: low
status: deferred
generation_target: 2
title: "Read-replica readiness audit of Neo4jKnowledgeStore"
filed_by: daedalus
created_at: 2026-04-19
description: |
  Neo4j 5.x supports clustered deployment with read-replica routing
  via the `neo4j+s://` URI scheme and the driver's `default_access_mode`
  parameter. Neo4jKnowledgeStore today opens one driver, one database,
  one access mode (write). A future demo-scale or community-scale
  deployment may want read-only retrieval queries to fan out to
  replicas while writes stay on the leader.

  This ticket is an audit, not an implementation. It asks: which
  Neo4jKnowledgeStore methods are pure reads (vector_search,
  traverse, multi_hop_search, get_node, get_neighborhood,
  list_pending_resolution, count_nodes, get_cluster_centroid,
  health) and could be marked `READ` access mode at session
  construction? Which are writes (every upsert_*, promote, degrade,
  update_scores, assign_cluster, import_nodes)? Which are mixed
  and need explicit decomposition?

  Acceptance:
    - One markdown table in docs/etappes/ (or wherever Daedalus
      decides) listing every method with its access classification.
    - One paragraph per "ambiguous" method (if any) with the
      decomposition recommendation.
    - One paragraph: "what would change in Neo4jKnowledgeStore code
      to actually wire access modes" — but no code change.

  Gen 2 explicitly because Gen 1 is single-instance; multi-instance
  read-replica deployment isn't on the demo path.

reopen_trigger: |
  Either: (a) a Gen 2 deployment scenario explicitly requires
  horizontal read scaling, or (b) a community contributor asks
  about replica support, signalling external demand.

related:
  - PHX-0001  # custom engine — replica-aware engine is a Gen 2 motivator
resolution: |
  Deferred 2026-05-07. Neo4j is the Gen-1 bridge store only; the target
  architecture is LanceDB + PyTorch CSR (Tensor-Manifold). Read-replica
  auditing for Neo4j is moot when the store is replaced. Reopen only if
  Neo4j is retained as a long-term component, which is not the current plan.
