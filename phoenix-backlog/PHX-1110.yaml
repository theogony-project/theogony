id: PHX-1110
category: substrate-retrieval
priority: high
status: done
generation_target: MESH — consumption (MESH_RETRIEVAL step 5), the answer instrument
title: "The answer arm on a corpus the model does not know: the Constellation on 2WikiMultihopQA"
filed_by: Claude Code (2026-09-16, Plan from the Vision, track C second piece)
created_at: 2026-09-16
description: >
  PHX-1098 closed the founding corpus as a control group: deepseek answers
  Hesiod at 86% with no material at all, and the Constellation comes in
  below that at 75%. On this corpus the answer arm measures the price of
  binding to the material, not the graph's added value. The question "does
  the graph help with answering" can only be asked where prior knowledge is
  low. 2WikiMultihopQA is such a corpus: prior knowledge 24.8% EM (PHX-1089).

  What PHX-1089 measured there was passages: retrieval hands the model
  whole paragraphs, and Spreading Activation over a cheap spaCy graph
  selected them (+5.0 EM over kNN at hybrid/S=2). What it did not measure
  is the substrate's own consumption format, the Constellation of entities
  and typed relations that `mesh ask` renders, on a corpus the model
  cannot know by heart.

  Scope, as a measurement: (1) a mesh from the 6,119 paragraphs of 2Wiki
  through the shipped write path (MeshParagraphReader), the Kadmos
  readings replayed from the PHX-1089 cache instead of paid for again, so
  that the mesh has the same linker, the same identity resolution and the
  same edges as a user corpus. (2) Four arms, one model, one scorer (SQuAD
  EM/F1, because the founding scorer strips digits and half of the 2Wiki
  answers are dates): closed_book (the prior), passages (top-k passages
  by cosine, the bridge to the published numbers), vector_only (top-k
  mesh entities by cosine, as descriptions), constellation (the same kind
  of entities plus the relations between them). Paired, question by
  question, with a sign test on the discordant pairs.

  The statement that counts is constellation against vector_only: the
  same node store, the same embedding, the only difference is whether the
  edges are shown. Against passages the harder question is whether the
  substrate's rendering form keeps up with plain RAG at all.
resolution: >
  Measured, 2026-09-16. Full text: docs/etappes/qa_constellation.md.

  Setup: a mesh from all 6,119 paragraphs of 2WikiMultihopQA through the
  shipped write path, the Kadmos readings replayed from the PHX-1089
  cache (35,906 nodes, 38,746 relations read, 81 minutes, no LLM call);
  five arms over 1,000 questions, deepseek-chat, SQuAD EM/F1, paired with
  a sign test.

  Result (EM): prior knowledge 33.8%, five passages 42.7, fifty entities
  without edges 40.5, constellation with structural edges 41.2,
  constellation without structural edges 44.1. The graph helps with
  answering where the model does not know the corpus: +3.6 EM / +4.3 F1
  over the same entities without edges (p = 0.03; 147 questions better,
  111 worse) — but only when the structural edges
  (co_mentions_in_paragraph, appears_in_source, 60% of the rendered
  lines) are left out; with them, +0.7 remains (p = 0.72), and they cost
  2.9 points (p = 0.004). Against five passages, a tie (+1.4, n.s.), made
  of two opposing pieces: on the 836 questions with a single entity as
  the answer, +5.6 over the passages (comparison questions, where the
  relations show the chain), on yes/no questions a collapse (37% against
  57% prior knowledge: the entity list tempts an entity answer), and on
  date questions almost nothing (9% against 33%: descriptions do not
  carry the dates). The mesh's ceiling is higher (answer present in the
  material 61% against 55%), the yield somewhat lower, and prior
  knowledge is suppressed more strongly. Repeated: +4.0 EM / +4.9 F1
  (p = 0.015), spread per arm under half a point. At half the budget
  (top_k 25) the gap shrinks to +1.2 EM (n.s.) / +2.7 F1 (p = 0.03), the
  ceiling falls from 61 to 53%: the gain needs enough entities for
  relations between them to become visible.

  Decision: render_constellation leaves out the structural edges by
  default (typed_only=True); every founding number before PHX-1110 was
  measured with them and stands as is; mesh ask keeps showing them to
  humans.

  Side finding, fixed: reading was quadratic — every node a Lance
  fragment until compaction, every vector search reads all of them
  (98 ms against 10 ms), 0.55 s per paragraph at the start, over 6 s by
  paragraph 400. A read now compacts every 200 paragraphs
  (MeshRuntime.compact, MeshParagraphReader.compact_every) and holds at
  0.80 s per paragraph.

  Caveat: prior knowledge stood at 24.8% in PHX-1089 (26 August), today
  at 33.8% — same model name, same prompts and questions; the model
  behind deepseek-chat is no longer the same one. All comparisons are
  within a single run.

  Open, not as a ticket: the yes/no weakness of the entity rendering
  form, the missing dates in the descriptions (the mesh holds no
  paragraph text), and mesh ask, which keeps showing the structural
  edges.
