id: PHX-1110
category: substrate-retrieval
priority: high
status: done
generation_target: MESH — Konsumtion (MESH_RETRIEVAL Schritt 5), das Antwort-Instrument
title: "Der Antwort-Arm auf einem Korpus, den das Modell nicht kennt: die Constellation auf 2WikiMultihopQA"
filed_by: Claude Code (2026-09-16, Plan aus der Vision, Spur C zweites Stück)
created_at: 2026-09-16
description: >
  PHX-1098 hat den Founding-Korpus als Kontrollgruppe geschlossen: deepseek
  beantwortet Hesiod zu 86 % ohne jedes Material, und die Constellation liegt
  mit 75 % darunter. Auf diesem Korpus misst der Antwort-Arm den Preis der
  Bindung an das Material, nicht den Mehrwert des Graphen. Die Frage "hilft
  der Graph beim Antworten" lässt sich nur stellen, wo das Vorwissen niedrig
  ist. 2WikiMultihopQA ist so ein Korpus: Vorwissen 24,8 % EM (PHX-1089).

  Was PHX-1089 dort gemessen hat, waren Passagen: das Retrieval reicht dem
  Modell ganze Absätze, und Spreading Activation über einen billigen
  spaCy-Graphen wählte sie aus (+5,0 EM gegen kNN bei hybrid/S=2). Was es
  nicht gemessen hat, ist das Konsumformat des Substrats selbst, die
  Constellation aus Entitäten und typisierten Relationen, die `mesh ask`
  rendert, auf einem Korpus, den das Modell nicht auswendig kann.

  Umfang, als Messung: (1) ein Mesh aus den 6.119 Passagen von 2Wiki durch
  den ausgelieferten Schreibpfad (MeshParagraphReader), die Kadmos-Lesungen
  aus dem Cache von PHX-1089 abgespielt statt neu bezahlt, damit das Mesh
  denselben Linker, dieselbe Identitätsauflösung und dieselben Kanten hat
  wie ein Nutzerkorpus. (2) Vier Arme, ein Modell, ein Bewerter (SQuAD
  EM/F1, weil der Founding-Bewerter Ziffern streicht und die Hälfte der
  2Wiki-Antworten Daten sind): closed_book (Vorwissen), passages (Top-k
  Passagen nach Kosinus, die Brücke zu den veröffentlichten Zahlen),
  vector_only (Top-k Mesh-Entitäten nach Kosinus, als Beschreibungen),
  constellation (dieselbe Art Entitäten plus die Relationen zwischen ihnen).
  Gepaart, Frage für Frage, mit Vorzeichentest auf den diskordanten Paaren.

  Die Aussage, die zählt, ist constellation gegen vector_only: derselbe
  Knotenspeicher, dieselbe Einbettung, der einzige Unterschied ist, ob die
  Kanten gezeigt werden. Gegen passages ist die härtere Frage, ob die
  Rendering-Form des Substrats mit schlichtem RAG überhaupt mithält.
resolution: >
  Gemessen, 2026-09-16. Volltext: docs/etappes/qa_constellation.md.

  Aufbau: ein Mesh aus allen 6.119 Passagen von 2WikiMultihopQA durch den
  ausgelieferten Schreibpfad, die Kadmos-Lesungen aus dem Cache von PHX-1089
  abgespielt (35.906 Knoten, 38.746 gelesene Relationen, 81 Minuten, kein
  LLM-Aufruf); fünf Arme über 1.000 Fragen, deepseek-chat, SQuAD EM/F1,
  gepaart mit Vorzeichentest.

  Ergebnis (EM): Vorwissen 33,8 %, fünf Passagen 42,7, fünfzig Entitäten
  ohne Kanten 40,5, Constellation mit Strukturkanten 41,2, Constellation
  ohne Strukturkanten 44,1. Der Graph hilft beim Antworten, wo das Modell den
  Korpus nicht kennt: +3,6 EM / +4,3 F1 über dieselben Entitäten ohne Kanten
  (p = 0,03; 147 Fragen besser, 111 schlechter) — aber nur, wenn die
  Strukturkanten (co_mentions_in_paragraph, appears_in_source, 60 % der
  gerenderten Zeilen) weggelassen werden; mit ihnen bleibt +0,7 (p = 0,72),
  und sie kosten 2,9 Punkte (p = 0,004). Gegen fünf Passagen Gleichstand
  (+1,4, n.s.), aus zwei gegenläufigen Stücken: auf den 836 Fragen mit einer
  Entität als Antwort +5,6 über die Passagen (Vergleichsfragen, bei denen die
  Relationen die Kette zeigen), auf Ja/Nein-Fragen ein Einbruch (37 % gegen
  57 % Vorwissen: die Entitätsliste verleitet zur Entitätsantwort) und auf
  Datumsfragen fast nichts (9 % gegen 33 %: Beschreibungen tragen die Daten
  nicht). Die Decke des Mesh ist höher (Antwort im Material 61 % gegen 55 %),
  die Ausbeute etwas niedriger, und das Vorwissen wird stärker unterdrückt.
  Wiederholt: +4,0 EM / +4,9 F1 (p = 0,015), Streuung je Arm unter einem
  halben Punkt. Mit halbem Budget (top_k 25) schrumpft der Abstand auf
  +1,2 EM (n.s.) / +2,7 F1 (p = 0,03), die Decke fällt von 61 auf 53 %: der
  Gewinn braucht genug Entitäten, damit Relationen zwischen ihnen sichtbar
  werden.

  Entscheidung: render_constellation lässt die Strukturkanten standardmäßig
  weg (typed_only=True); jede Founding-Zahl vor PHX-1110 wurde mit ihnen
  gemessen und bleibt so stehen; mesh ask zeigt sie dem Menschen weiter.

  Nebenbefund, behoben: das Lesen war quadratisch — jeder Knoten ein
  Lance-Fragment bis zur Kompaktierung, jede Vektorsuche liest alle (98 ms
  gegen 10 ms), 0,55 s je Absatz am Anfang, über 6 s bei Absatz 400. Ein
  Lesen kompaktiert jetzt alle 200 Absätze (MeshRuntime.compact,
  MeshParagraphReader.compact_every) und hält 0,80 s je Absatz.

  Vorbehalt: das Vorwissen stand in PHX-1089 (26. August) bei 24,8 %, heute
  bei 33,8 % — derselbe Modellname, dieselben Prompts und Fragen; hinter
  deepseek-chat antwortet nicht mehr dasselbe Modell. Alle Vergleiche sind
  innerhalb eines Laufs.

  Offen, nicht als Ticket: die Ja/Nein-Schwäche der Entitäts-Rendering-Form,
  die fehlenden Daten in den Beschreibungen (das Mesh hält keinen
  Absatztext), und mesh ask, das die Strukturkanten weiter zeigt.
