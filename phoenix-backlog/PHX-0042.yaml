id: PHX-0042
category: performance
priority: medium
status: open
generation_target: 1
title: "Cypher query-plan audit for hot read paths in Neo4jKnowledgeStore"
filed_by: daedalus
created_at: 2026-04-19
description: |
  E7 ships Neo4jKnowledgeStore (Plan §3.1a) without a query-plan
  audit. The store passes the contract suite and the Plan §3.1a
  range indexes are in place, but no `EXPLAIN`/`PROFILE` data
  exists for the hot read paths. The Gen 1 demo (Plan §1) is
  retrieval-anchored — every `theogony ask` round-trips through
  vector_search → traverse → get_neighborhood. A plan miss on any
  of those degrades the demo perceptibly (200 ms vs 2 s noticeable;
  2 s vs 20 s demo-killing).

  Hot paths to audit (in priority order):
    1. vector_search — HNSW + WHERE filter on layer/node_type/min_confidence
       (uses knowledge_node_layer + knowledge_node_node_type indexes).
    2. traverse — variable-length [r:RELATION*1..max_depth] with weight + type filters.
    3. get_neighborhood — undirected variable-length match.
    4. multi_hop_search — vector seed + N traverse calls (N=k).
    5. list_pending_resolution — manual_resolution_needed=true filter.

  Acceptance:
    - One PROFILE invocation per path against a populated database
      (≥2000 nodes, ≥2000 edges; the E8 retrieval slice qualifies).
    - For each path: db hits per record returned, total db hits,
      whether the expected index is selected.
    - For each path that misses its expected index OR exceeds an
      "obvious" budget (>1000 db hits per returned record): one
      diagnosis paragraph + a remediation suggestion (rewrite the
      Cypher, add a missing composite index, or accept the cost
      with rationale).

  Out of scope (Gen 1):
    - Cluster-aware Cypher routing (Gen 2).
    - Apoc-based query rewriting (Gen 2 PHX-0011 region).
    - Continuous query-plan regression (Reviewer-agent territory,
      PHX-0035).

  YAGNI guard: file but do NOT execute until E8 (retrieval stack)
  is functionally complete. Auditing the Cypher before retrieval
  is wired to it produces academic numbers; auditing after wiring
  produces production-relevant numbers.

reopen_trigger: |
  Execute when E8 is review-ready AND a representative book has been
  ingested into Neo4j (e.g. Hedin Trans-Himalaya full-book).

