id: PHX-1098
category: evaluation
priority: high
status: done
generation_target: MESH migration — instrument quality
title: "The founding gold set has no answer aliases, so a correct answer in other words scores zero"
filed_by: Claude Code (2026-08-31, from the PHX-1097 measurement)
created_at: 2026-08-31
description: >
  `qa_datasets.py` has carried `answer_aliases` since PHX-1089 for the HippoRAG
  sets. `eval/gold/founding_corpus.json` has none, and `corpus_answers._score`
  matches the gold string literally. Two consequences, both seen live while
  measuring consolidation:

    hyperion-children   expected: Helius, Selene, Eos
      "Eos, Selene, Helios, Helius"   3/3   <- names one god twice, full marks
      "Helios, Eos, Selene"           2/3   <- correct and non-redundant

    nereus-daughters    expected: Nereus
      "The fifty sea nymph daughters of Nereus and Doris..."   1/1
      "Thetis, Amphitrite, Eudora, Thoe, Cymatolege, ..."      0/1

  The first is the sharper one: the substrate held `Helios` and `Helius` as two
  nodes, the model echoed both, and the scorer rewarded it. Consolidation merged
  them, the model stopped repeating itself, and the instrument charged a point.
  **The gold set was satisfiable by a duplication the substrate is supposed to
  remove.**

  Deliberately NOT fixed inside PHX-1097: the fix raises that change's own
  numbers, and an instrument correction that lands with the result it flatters is
  worth nothing. It belongs in its own change, with the affected measurements
  re-run afterwards.

  Scope: add `aliases` per expected entity in `founding_corpus.json`, teach
  `_score` to accept any of them, and re-run the answer measurements that this
  affects (PHX-1087, PHX-1096, PHX-1097). Note that this changes historical
  numbers, so the re-run has to be reported as a re-measurement rather than
  quietly replacing them.
  Nachtrag 2026-09-12 (PHX-1109): a second defect of the same file, the
  mirror image of the first. 30 of the 111 gold names stand in their own
  question — "How were Chrysaor and Pegasus born?" expects Chrysaor and
  Pegasus, "What measures the depth of Tartarus?" expects Tartarus — and the
  substring scorer pays for them whenever an answer repeats the question.
  That inflates every arm equally only as long as every arm answers in names;
  an arm that answers in sentences (the soft arm of PHX-1109, trained by
  paraphrase) repeats the question far more often and scored 28% where a
  strict count gave 11%. `latent_mile.strict_rows` drops those names and the
  8 questions that have nothing left; the fix in the gold file is to expect
  what the question asks for, not what it mentions.
resolution: >
  Repariert und neu gemessen, 2026-09-16. Volltext docs/etappes/gold_aliases.md.

  Die Datei: 92 Gold-Namen statt 111, mit 130 Aliasen je erwartetem Namen
  (die Schreibungen der Uebersetzung und der Modelle); die 30 Namen, die in
  ihrer eigenen Frage standen, erwarten jetzt, was die Frage fragt; drei
  Erwartungen waren gegen den Korpus falsch und sind korrigiert (Arabus statt
  Belus; Sphinx und Nemeischer Loewe statt Echidna/Orthus; Atlas fehlte).
  Der Code: `_score(..., aliases)` zaehlt den kanonischen Namen einmal, der
  Retrieval-Abgleich, die latente Meile und der Herzschlag lesen die Aliase.
  Zwei Tests halten es fest (kein Name oder Alias in der eigenen Frage; jeder
  Alias gehoert zu einem erwarteten Namen); die Zaehlungen sind exakt gepinnt.

  Neu gemessen -- dieselben Antworten, drei Bewerter, statt die alten Zahlen
  stillschweigend zu ersetzen:

      deepseek-chat, 3 Laeufe     altes Gold   ohne nachgesprochene   neues Gold
      closed_book (Vorwissen)        47 %             65 %              86 %
      vector_only                    47 %             57 %              63 %
      constellation (Graph)          61 %             72 %              75 %

  Was haelt: Graph gegen Vektorsuche +11, unter jedem Bewerter. Was kippt:
  Graph gegen Vorwissen aus +11 wird -11, weil das alte Gold das Vorwissen
  systematisch unterbewertet hatte ("Cerberus" auf die Echidna-Frage war
  richtig und bekam null). Die Streuung der Kontrollgruppe fiel von neun
  Punkten (PHX-1087) auf zwei -- ein Teil des "Modellrauschens" war der
  Bewerter. Retrieval auf dem Founding-Mesh 80 statt 87 Prozent, weil
  nachgesprochene Namen gratis abrufbar waren; erzaehlend 65 statt 86.

  Folge: auf einem Korpus, den das Modell zu 86 Prozent auswendig kann, misst
  der Antwort-Arm den Preis der Bindung an das Material, nicht den Mehrwert
  des Graphen. Der Antwort-Arm auf einem unbekannten Korpus (Spur C, zweites
  Stueck) ist damit die einzige Art, diese Frage zu stellen. Die Zahlen aus
  PHX-1087/1096/1097/1099 bleiben in ihren Tickets, wie gemessen; k_seeds = 1
  ruht auf dem Retrieval-Tune/Test und bleibt.
relates_to:
