title: Wikidata5m bulk seed (S2.5)
filed_by: Chaos (via Cursor AI agent, operator-directed)
created_at: 2026-05-15
description: >
  Interpolated bootstrap step S2.5 between S2 (Kadmos v2 cognitive reading)
  and S3 (diversified-injection retrieval) in MESH_MIGRATION_PLAN.md.

  Goal: populate the new substrate with ~4.81M Q-ID-anchored Tier-1
  ConsolidatedNodes and ~21.35M relational Edges from the Wikidata5m
  KEPLER dataset (https://deepgraphlearning.github.io/project/wikidata5m,
  transductive split, 2019/2020 snapshot). For each Q-ID, embed the
  Wikipedia first-paragraph off-substrate into semantic_vector and
  description_vector; keep description = None or entity-name only. The
  source paragraph body never enters the mesh — asserted by a dedicated
  test_wikidata5m_no_raw_text.py invariant.

  Why this step exists: S2 (Kadmos v2) is the right shape for cognitive
  reading of new external texts but the wrong shape for bootstrapping the
  identity backbone. At LLM cost per paragraph, building a 1M-node
  substrate via Kadmos v2 alone is months of LLM time and three-figure
  euro cost. The substrate needs Q-ID-anchored Tier-1 nodes before it has
  cognitive load, so that every later Kadmos v2 reference fires signal 1
  (Q-ID match) of the eager-linker hierarchy
  (MESH_SUBSTRATE.md §"Why two tiers — and how identity actually gets
  committed") instead of creating candidates that never converge.

  Doctrine alignment:
  - MESH_SUBSTRATE.md §"Why two tiers" signal 1 — Q-ID is the strongest
    identity signal; wikidata5m is the doctrine-preferred bootstrap.
  - BUILD_DOCTRINE.md engineering order — data structure first, synthesis
    second, retrieval third; wikidata5m is data structure first.
  - PR #156 (clarified "no raw text in substrate") makes the S2.5
    invariant unambiguous: paragraph bodies are embedded off-substrate;
    only the two resulting vectors land on ConsolidatedNode.

  Non-goals (hard scope cap):
  - No retrieval beyond `theogony mesh status`. The retrieval path is S3.
  - No description regeneration or re-embedding. A future "Wikidata
    freshening pass" PHX ticket pulls fresh first-paragraphs via Q-ID
    and re-embeds; that is a separate step, not S2.5.
  - No coupling to Kadmos v2 internals beyond using the same
    MeshTextVectorizer (or a leaner equivalent) for embedding consistency.
  - No Cockpit / MCP integration. Those remain S4.
  - No consolidation, splits, pathology, therapy. Those remain S5.
  - No deletion of the legacy path. That remains S6.
  - No raw text storage anywhere. The wikidata5m_text.txt paragraphs are
    read off-substrate, embedded, and discarded from the import path;
    they remain on disk in data/raw/wikidata5m/ for later refresh runs
    but never enter the mesh's stored fields.

  Pre-conditions:
  - S2 merged (PR #154 dense paragraph topology) ✅
  - Doctrine clarification merged (PR #156) ✅
  - S2.5 step added to migration plan (PR #157) ✅
  - The four wikidata5m files staged at data/raw/wikidata5m/
    (wikidata5m_entity.txt, wikidata5m_text.txt, wikidata5m_relation.txt,
    wikidata5m_all_triplet.txt) — already moved into place 2026-05-15.
  - Operator decision on the embedding model (recommended: BGE-M3 class,
    1024-d, doctrine default).

  Deliverables (per MESH_MIGRATION_PLAN.md §"Step S2.5"):
  - New package src/theogony/mesh/seeds/wikidata5m/ with loader.py,
    relations.py, embedder.py, importer.py.
  - MeshSeedRunReport extension to src/theogony/reporting/models.py.
  - New CLI subcommand `theogony mesh seed wikidata5m` with
    --max-entities, --max-triplets, --batch-size, --dry-run, --root,
    --data-root flags.
  - Six tests in tests/mesh/seeds/ including the
    test_wikidata5m_no_raw_text.py invariant.

  Definition of Done:
  - `theogony mesh seed wikidata5m --max-entities 1000 --max-triplets 5000`
    produces 1000 Q-ID-anchored Tier-1 nodes + ≤ 5000 edges, audit ledger
    entry per insertion, MeshSeedRunReport written, description column is
    empty or entity-name-only on every node (verified via direct LanceDB
    inspection).
  - Subsequent `theogony mesh ingest --text-file <fixture-with-seeded-qid>`
    eager-links via signal 1 to the seeded Tier-1 node (no candidate).
  - pytest -q tests/mesh green; pytest -q green (no regression).
  - Q-ID uniqueness invariant holds.

  Smoke-1 result (2026-05-15) — PASS:
  - Seed: 1000 entities streamed, 1000 entities upserted, 0 duplicates,
    10 entities_missing_text (1%), 2 inter-slice edges upserted,
    0 loader_malformed_lines, MeshSeedRunReport written
    (data/run_reports/mesh_seed/01KRMZX2TNYZX1M65XN901Y6AV.json,
    verdict=good).
  - Handoff: `theogony mesh ingest` against the operator-aligned embedder
    config (THEOGONY_EMBEDDING__MODEL_ID=BAAI/bge-m3,
    THEOGONY_EMBEDDING__DIM=1024) and the new
    tests/mesh/seeds/fixtures/paragraph_smoke1_handoff.txt fixture
    (Q947890 / Renan Barao, picked from the real 1000-entity slice via
    the deterministic _build_handoff_fixture.py helper) produced
    tier_counts = {"4": 1, "1": 4} — one signal-1 (Q-ID) match against
    the seeded Tier-1 node, plus four expected emergent candidates for
    concepts outside the seeded slice.
  - Operator note: the Kadmos ingest path defaults to bge-small-en-v1.5
    at 384-d via Settings.embedding; without the BAAI/bge-m3 +
    THEOGONY_EMBEDDING__DIM=1024 override, MeshTextVectorizer silently
    falls back to deterministic hash-projection, which makes Tier-2 and
    Tier-3 linking structurally unable to match seeded nodes (only the
    vectorless Tier-4 QID path survives). Tracked as PHX-1031 (mesh
    ingest --embedder CLI flag).
  - Performance: 476s for 1000 bge-m3 embeddings (~0.48s/entity). MPS-vs-CPU
    not provable from the run logs; tracked as PHX-1032
    (device-info logging in MESH embedders).
  - Smoke-2..N (10k, 100k, 500k, 4.81M entities) remain pending; status
    stays `open` until at least Smoke-2 (PHX-1033) has been run.

