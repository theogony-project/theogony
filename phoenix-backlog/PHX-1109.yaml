id: PHX-1109
category: substrate-retrieval
priority: high
status: done
generation_target: MESH — consumption (MESH_RETRIEVAL step 5), the last mile
title: "The latent last mile: handing over the Constellation as vectors instead of as text"
filed_by: Claude Code (2026-09-11, from the assessment of latent reasoning)
created_at: 2026-09-11
description: >
  The Vision says (VISION:44): the Constellation is returned to the agent
  in vector form, injectable directly into its latent space, without
  translation into text. The ledger carries the sentence as unverifiable.
  As of today it is verifiable, and cheaply so.

  Prompted by: the reports from September 2026 about latent reasoning.
  Two findings, separately. First, today's frontier models already
  compute essentials that do not surface in their chain of thought
  (Baherwani, Goldstein, Panda 2026: content-free filler tokens raise
  accuracy by up to 13 points; Wang 2026: reasoning is a latent
  trajectory, the text a projection). Second, architectures without text
  intermediate steps work, but small: LOTUS (Fan, Svete, Lee, June 2026)
  closes the gap to explicit chain-of-thought at 3B; Kohli et al. (COLM
  2026) show implicit multi-hop in a single forward pass; no frontier lab
  has shipped a latent reasoner. The direction of the core thesis becomes
  respectable with this. For us it is still unmeasured, because for us
  everything runs through text: Kadmos receives text and returns JSON,
  the Constellation is rendered as text and read by deepseek-chat, the
  answer is text. The MNLM module (2,400 lines) is a tensor scaffold, the
  KV injection a stub, PHX-1035 blocked on H100. The last mile is today
  the only mile.

  xRAG (Cheng et al. 2024) shows that a frozen retriever, a frozen model
  and a small trained projector suffice to hand over a document as a
  single token: on average +10% on six knowledge tasks at 3.5-fold fewer
  FLOPs. The MNLM brief rejected exactly this path (GNP soft prompts) as
  diluted. The brief is right about the horizon and wrong about the
  order: the soft-prompt path is the falsifier we can afford.

  Scope, as a measurement: an open small reader with an embedding input,
  frozen; a projector from the node vectors into its embedding space, one
  node = one soft token, trained like xRAG stage 1 (paraphrase) on the
  consolidated nodes, the gold set untouched; three arms with the same
  reader and the same scoring as corpus_answers plus an untrained
  projector as a control. A null result is a result.
resolution: >
  Measured, 2026-09-12. The vector arrives, the answer does not. Full
  text: docs/etappes/latent_mile.md.

  Setup: Qwen2.5-3B-Instruct frozen (the 1.5B from the brief already
  barely reads the text material, 24% against 33% prior knowledge, and
  was dropped), projector 768 -> 2048 -> 2048 (semantic +
  description_vector; semantic alone also measured), paraphrase training
  on 3,529 nodes with 186 held out, four arms over 47 gold questions,
  three projectors (two seeds, one vector variant), one continued to 20
  epochs.

  What the token carries: on held-out nodes, the name with the correct
  vector costs 2.9 nats per token, with another node's vector 4.9 (five
  epochs); 2.4 against 6.8 after twenty. Identity flows, growing,
  generalising, until the projector starts memorising from epoch 15. The
  semantic vector alone carries just as much as both together.

  What the reader makes of it, strictly scored (without the 30 of 111
  gold names that appear in the question itself; 39 questions): text
  49%, prior knowledge 14%, vectors 9 / 11 / 1 / 11% (both s0, both s1,
  semantic, both 20 epochs), untrained 0%. Paired against text: 0
  questions better in every run (24, 22, 25, 20 worse). Against
  untrained: wins in every run, never loses. Against prior knowledge:
  even.

  The shipped scorer would have reported a tie: after 20 epochs -2
  against text, 13 better / 17 worse, 11 complete answers against 8. All
  thirteen wins are questions whose gold names appear in the question,
  and the arm trained by paraphrase answers in sentences that echo the
  question back (6 words against 2). The strict scoring now lives in the
  harness (strict_rows), the gold-set error as an addendum in PHX-1098.

  Why: what is built is xRAG stage 1 (decode the token), not stage 2 (use
  the token under an instruction, instruction tuning with
  self-distillation from the text teacher). More epochs are not the
  lever (strict 9 -> 11%), stage 2 is, and it needs question-answer data
  that is not the gold set. VISION:44 thus splits into two measured
  halves: "receives structure" yes, "no text translation required" at
  this scale and with this recipe no.

  What stays in the repo: latent_mile.py (projector, reader with its own
  greedy loop, because generate() with inputs_embeds on MPS under
  transformers 5.5 delivers nonsense; paraphrase training with gradient
  checkpointing; four arms; diagnostics; strict scoring),
  scripts/mesh_latent_mile.py, tests, the curves of every run in
  docs/etappes/latent_mile_runs.json.
