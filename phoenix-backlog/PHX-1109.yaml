id: PHX-1109
category: substrate-retrieval
priority: high
status: done
generation_target: MESH — Konsumtion (MESH_RETRIEVAL Schritt 5), die letzte Meile
title: "Die latente letzte Meile: die Constellation als Vektoren statt als Text übergeben"
filed_by: Claude Code (2026-09-11, aus der Einschätzung zu latentem Reasoning)
created_at: 2026-09-11
description: >
  Die Vision sagt (VISION:44): die Constellation wird dem Agenten in Vektorform
  zurückgegeben, direkt in seinen latenten Raum injizierbar, ohne Übersetzung
  in Text. Die Ledger führt den Satz als nicht prüfbar. Er ist es seit heute,
  und zwar billig.

  Anlass: die Berichte vom September 2026 über latentes Reasoning. Zwei
  Befunde, getrennt. Erstens rechnen heutige Frontier-Modelle schon
  Wesentliches, das in ihrer Gedankenkette nicht auftaucht (Baherwani,
  Goldstein, Panda 2026: inhaltsleere Fülltokens heben die Genauigkeit um bis
  zu 13 Punkte; Wang 2026: Reasoning ist eine latente Trajektorie, der Text
  eine Projektion). Zweitens funktionieren Architekturen ohne Text-Zwischen-
  schritte, aber klein: LOTUS (Fan, Svete, Lee, Juni 2026) schließt bei 3B
  zum expliziten Chain-of-Thought auf; Kohli et al. (COLM 2026) zeigen
  implizites Multi-Hop in einem Vorwärtsdurchlauf; kein Frontier-Lab hat
  einen latenten Reasoner ausgeliefert. Die Richtung der Kernthese wird
  damit respektabel. Bei uns ist sie trotzdem ungemessen, weil bei uns alles
  durch Text läuft: Kadmos bekommt Text und gibt JSON, die Constellation wird
  als Text gerendert und von deepseek-chat gelesen, die Antwort ist Text. Das
  MNLM-Modul (2.400 Zeilen) ist ein Tensor-Gerüst, die KV-Injektion ein Stub,
  PHX-1035 auf H100 blockiert. Die letzte Meile ist heute die einzige Meile.

  xRAG (Cheng et al. 2024) zeigt, dass ein eingefrorener Retriever, ein
  eingefrorenes Modell und ein kleiner trainierter Projektor genügen, um ein
  Dokument als ein einziges Token zu übergeben: im Schnitt +10 % auf sechs
  Wissensaufgaben bei 3,5-fach weniger FLOPs. Das MNLM-Brief hat genau diesen
  Weg (GNP-Soft-Prompts) als verwässert abgelehnt. Das Brief hat beim
  Horizont recht und bei der Reihenfolge nicht: der Soft-Prompt-Pfad ist der
  Falsifikator, den wir uns leisten können.

  Umfang, als Messung: ein offener Kleinleser mit Einbettungs-Eingang,
  eingefroren; ein Projektor von den Knotenvektoren in seinen Einbettungsraum,
  ein Knoten = ein weiches Token, trainiert wie xRAG Stufe 1 (Paraphrase) auf
  den konsolidierten Knoten, das Gold-Set unberührt; drei Arme mit demselben
  Leser und derselben Bewertung wie corpus_answers plus untrainierter
  Projektor als Kontrolle. Ein Nullergebnis ist ein Ergebnis.
resolution: >
  Gemessen, 2026-09-12. Der Vektor kommt an, die Antwort nicht. Volltext:
  docs/etappes/latent_mile.md.

  Aufbau: Qwen2.5-3B-Instruct eingefroren (der 1,5B aus dem Brief liest schon
  das Text-Material kaum, 24 % gegen 33 % Vorwissen, und wurde verworfen),
  Projektor 768 -> 2048 -> 2048 (semantic + description_vector; semantic
  allein ebenfalls gemessen), Paraphrase-Training auf 3.529 Knoten mit 186
  zurückgehalten, vier Arme über 47 Gold-Fragen, drei Projektoren (zwei
  Seeds, eine Vektorvariante), einer auf 20 Epochen fortgesetzt.

  Was das Token trägt: auf zurückgehaltenen Knoten kostet der Name mit dem
  richtigen Vektor 2,9 nats je Token, mit dem Vektor eines anderen Knotens
  4,9 (fünf Epochen); 2,4 gegen 6,8 nach zwanzig. Identität fliesst, wachsend,
  verallgemeinernd, bis der Projektor ab Epoche 15 auswendig lernt. Der
  semantische Vektor allein trägt genauso viel wie beide zusammen.

  Was der Leser daraus macht, streng bewertet (ohne die 30 von 111
  Gold-Namen, die in der Frage selbst stehen; 39 Fragen): Text 49 %,
  Vorwissen 14 %, Vektoren 9 / 11 / 1 / 11 % (both s0, both s1, semantic,
  both 20 Epochen), untrainiert 0 %. Gepaart gegen Text: 0 Fragen besser in
  jedem Lauf (24, 22, 25, 20 schlechter). Gegen untrainiert: gewinnt in jedem
  Lauf, verliert nie. Gegen Vorwissen: gleich.

  Der ausgelieferte Bewerter hätte Gleichstand gemeldet: nach 20 Epochen -2
  gegen Text, 13 besser / 17 schlechter, 11 vollständige Antworten gegen 8.
  Alle dreizehn Gewinne sind Fragen, deren Gold-Namen in der Frage stehen,
  und der per Paraphrase trainierte Arm antwortet in Sätzen, die die Frage
  nachsprechen (6 Wörter gegen 2). Die strenge Bewertung steht jetzt im
  Harness (strict_rows), der Gold-Set-Fehler als Nachtrag in PHX-1098.

  Warum: gebaut ist xRAG Stufe 1 (das Token dekodieren), nicht Stufe 2
  (das Token unter einer Anweisung benutzen, Instruktionstuning mit
  Selbst-Destillation vom Text-Lehrer). Mehr Epochen sind nicht der Hebel
  (streng 9 -> 11 %), Stufe 2 ist es, und die braucht Frage-Antwort-Daten,
  die nicht das Gold-Set sind. VISION:44 zerfällt damit in zwei gemessene
  Hälften: "receives structure" ja, "no text translation required" auf dieser
  Skala und mit diesem Rezept nein.

  Im Repo bleibt: latent_mile.py (Projektor, Leser mit eigenem Greedy-Loop,
  weil generate() mit inputs_embeds auf MPS unter transformers 5.5 Unsinn
  liefert; Paraphrase-Training mit Gradient-Checkpointing; vier Arme;
  diagnose; strenge Bewertung), scripts/mesh_latent_mile.py, Tests, die
  Kurven aller Läufe in docs/etappes/latent_mile_runs.json.
