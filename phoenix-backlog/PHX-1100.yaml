description: >
  Five times in a row, while working on something else, a doctrine mechanism
  turned up whose input nobody writes (decay_tier, the activation threshold,
  frame_consistency, the frame-routing caller, fired_total). This inventory
  checks whether that is a pattern.

  It is one. For every mechanism in the three doctrine documents, the check
  was: implemented? reached by a real path? inputs actually produced? Five
  intake passes, then one adversarial pass each that tried to refute every
  "does not run" — 110 attempts, 105 confirmed, 4 corrected upward, 1 downward.

      runs         9
      partial     24
      inert       34
      blocked     10
      absent      42
                 119

  The number 119 is a decomposition choice; the patterns underneath it are the
  finding. Full text: docs/etappes/doctrine_inventory.md.
resolution: >
  The inventory is in. Five patterns, the three most important remeasured
  myself:

  1. THE SUBSTRATE CAN ONLY FORGET. Decay runs (14 ticks, λ=0.05, visible in
  the weight spectrum). Hebbian reinforcement has never fired — all 14 tick
  records carry `delta_drained: 0`. And the calibration: eight real queries with
  `hebbian=True` wrote 512 deltas, strongest 2.9e-4, median 1.9e-5, against
  4.8e-3 decay per tick on the median weight. **The strongest reinforcement a
  single query can give is 17 times smaller than one tick of forgetting, 254
  times in the median.** α and λ were never measured against each other. Split
  out as PHX-1102.

  2. SEVENTEEN FIELDS HOLD ONE VALUE ACROSS THE WHOLE SUBSTRATE. Measured over
  5,002 nodes and 94,490 edges: fired_total, fired_recent, the three feedback
  counters, eligibility, feedback_modulated_strength, decay_tier,
  frame_consistency, consolidation_tier, consolidation_history,
  structural_vector, temporal_vector, activation_entropy, node_potential_cache,
  is_anchor, qids. That is not seventeen bugs but one: **the substrate keeps no
  memory of its own activity**, and everything that reads from it reads a story
  nobody writes down. Split out as PHX-1101.

  3. THE TIER LADDER IS BACKWARDS, where the substrate lives. For 0 < w < 1,
  w^1.2 > w^2 — a smaller exponent removes MORE weight. At the median weight
  0.3112: k=2 loses 0.00484 per tick, k=1.2 loses 0.01226. Every weight sits
  below 1 because w_max holds it there. **Filling the field honestly would not
  be a fix but the reversal of the intent.** The global renormalisation (not
  built) has to come before it.

  4. WIRED UP, BUT WITHOUT DISCRIMINATING POWER: frame routing (no caller
  passes a query_frame, and the frame vectors are a salted SHA-256 projection of
  the label), damping and hop count (read only in the raw/degnorm branch,
  shipped is ppr), saturation (cap 10,000 against a maximum out-degree of 1,093),
  activation threshold (does not exist).

  5. TWO WRITERS, NO LOCK, NO SNAPSHOT. read_consistency=0 is the opposite of
  a pinned snapshot; checkout/restore/as_of do not occur anywhere in the repo; no
  lock anywhere in src/. Since PHX-1097 there have been two unprotected
  read-modify-write cycles across the whole substrate from different processes.

  Side finding, its own ticket: all 1,206 raw_text_ref point to 13 files in a
  deleted session scratchpad (PHX-1103).
