id: PHX-1105
category: infrastructure
priority: high
status: done
generation_target: MESH — storage layer
title: "lancedb 0.38 reads double quotes as identifiers — every filter in the store broke"
filed_by: Claude Code (2026-09-02, from the first CI run of PHX-1102)
created_at: 2026-09-02
description: >
  The first code PR after the version jump (local 0.37.1, CI resolves 0.38.0)
  failed with 40 tests in CI, with 1,851 green tests locally. Error signature:

      Schema error: No field named "01M1H1A7D3BB77Z0SF36SMRG05".
      Valid fields are id, payload_json, semantic_vector, ...

  lance-datafusion 11 reads a double-quoted token in `where`/`delete` as an
  **identifier**, as standard SQL does; 0.37 had tolerated it as a string.
  Every filter in `storage/nodes.py` and `storage/edges.py` — `id = "{…}"`,
  `id IN ("…","…")`, `label = "…"`, `qid = "…"`, `source_id = "…"` — was
  built that way. Ten places.

  This is the fourth manifestation of the same gap (AGENTS.md §5, PHX-1057,
  PHX-1076): CI resolves package versions newer than the local venv, and
  local-green means nothing.
resolution: >
  Reproduced locally by raising the venv to 0.38.0 (within the
  `lancedb>=0.6.0` allowed in pyproject) — 66 failures in tests/mesh +
  cockpit. Then a helper `storage/sql.py` with `sql_literal()` / `sql_in()`:
  single quotes, `'` doubled as `''` — standard SQL, accepted by 0.37 as by
  0.38 (both measured). All ten places converted, `_sql_quote` (which
  escaped `"`) removed. 444 tests in tests/mesh + cockpit green on 0.38.

  Pinned down in tests/mesh/test_sql_literals.py: a static test that refuses
  the form `= "{…}"` in every store file, and a functional one that sends an
  apostrophe through every lookup method.

  Not done: a pinning decision. That is PHX-1076 and Jakob's choice; the
  dialect fix is correct independent of it.
relates_to:
  - PHX-1102   # the PR that found it
  - PHX-1076   # lockfile / pinning, open
  - PHX-1057   # the first time a lancedb API drifted between local and CI
linked_scripts:
  - src/theogony/mesh/storage/sql.py
  - tests/mesh/test_sql_literals.py
