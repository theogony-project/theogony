id: PHX-1103
category: data-hygiene
priority: medium
status: done
generation_target: MESH — data hygiene on the demo mesh
title: "All 1,206 raw_text_ref point to a deleted session directory"
filed_by: Claude Code (2026-08-31, from the doctrine inventory)
created_at: 2026-08-31
description: >
  Every chunk node in `data/mesh-founding` carries a `raw_text_ref` of the form

      /private/tmp/claude-501/…/scratchpad/fullread/batch_00.txt#p1

  13 different files, **not a single one still exists**.
  `SourceProvenance.source_identifier` carries the same dead path.

  MESH_SUBSTRATE names `raw_text_ref` explicitly as what lets the immune system
  or an Oneiros tick re-derive a chunk off the hot path —
  "an opaque pointer back to the source — an identifier like `gutenberg_43497#p17`".
  On this mesh that is impossible.

  PHX-1084 repaired exactly this problem for the **source anchors** and
  corrected ingestion going forward (`source_identifier` is now
  `gutenberg_{book_id}`). The chunk level of the existing mesh was never
  brought up to date, and `scripts/mesh_repair_anchor_provenance.py` only
  writes the consolidated table.

  So it is no longer a code defect but an uncleaned data artefact — on exactly
  the mesh that the demo shows. Scope: a repair run over `chunk_nodes` that
  replaces the path prefix with the Gutenberg identifier and keeps the
  paragraph number.
resolution: >
  Repaired on `data/mesh-founding` (the consolidated mesh promoted since
  2026-09-02): `scripts/mesh_repair_chunk_provenance.py --apply` rewrote all
  1,206 chunks — `batch_NN.txt#pM` → `gutenberg_348#p(NN·100+M)`,
  `source_identifier` → `gutenberg_348`, the numbering that the repaired
  ingestion (PHX-1084) writes. Measured beforehand: batches 00–11 carry
  p1..p100, batch 12 p1..p10 — 1,210 paragraphs, the number from the full
  run. Idempotent: a second run finds 0 chunks left to repair. For this,
  `MeshNodeStore.iter_chunks` and `replace_all_chunks` (an overwrite,
  PHX-1082) with tests.
relates_to:
  - PHX-1084   # the same repair, for the anchors
  - PHX-1100   # the inventory
