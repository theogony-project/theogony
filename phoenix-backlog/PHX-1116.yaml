id: PHX-1116
category: substrate-ingestion
priority: low
status: done
generation_target: MESH — the reader's failure report (BUILD_DOCTRINE honest failure)
title: "A read that raises mid-paragraph writes no report and leaves its buffered edges unwritten"
filed_by: Claude Code (2026-10-20, from the review of mesh_append)
created_at: 2026-10-20
description: >
  MeshParagraphReader.read_text has no try/except around its body. After the
  source anchor and possibly entities have been appended, a Lance failure in
  append_edges, _flush_edges or the audit flush propagates out of the call:
  the buffered _pending_edges die with the reader instance, and no
  IngestRunReport with verdict "failed" is written. Every caller — the CLI
  ingest, the demo replay, the benchmark scripts and, since mesh_append, a
  remote MCP client — gets the exception string and nothing else. Contract 3
  (AGENTS.md) asks for a structured failure report from a failed run; the
  tick got this in PHX-1082 and the reader did not. Found by the review of
  mesh_append, which is the first path where the caller has nothing but that
  string and cannot read the audit log.
acceptance: >
  read_text writes an IngestRunReport with status "failed" and the exception
  in its reasoning when the body raises after the source anchor was written,
  flushes what it safely can -- the buffered edges, the staged audit rows and,
  since PHX-1118, the pending description revisions -- and re-raises; a test forces the failure (a
  monkeypatched append_edges) and reads the report. mesh_append then returns
  the report's run_id in its error payload.
resolution: >
  Done, 2026-11-07. MeshParagraphReader.read_text is now a wrapper around the
  read (`_read`): when the read raises, `_report_failure` writes what the
  failure left writable and an IngestRunReport with status and verdict
  "failed", and the exception propagates unchanged, with a note naming the
  report. The read's counters live on one object (`_ReadTally`) and both
  reports come from one builder; the failure report's node and edge counts
  are taken from the store's tables against their row counts at the start of
  the read (three metadata reads), because a write that raises part-way --
  append_edges writes three tables in turn, a node write three more -- leaves
  the read's own counters short. The buffers the failure did not come from are
  written: the edges (each points only at nodes already written), the staged
  audit rows, the pending description revisions, the run's row. A buffer
  whose own write raised is not written again, and the first failure keeps
  its mark when a second one follows. An audit write that raises keeps its
  rows (`flush` its batch, `append` its row) and the failure path tries them
  once more -- a single table add cannot duplicate them; rows it still cannot
  write are reported as held only in memory. A read whose success report
  cannot be written gets one run row, not two. `failure_report`,
  `failure_report_path` and `failure_report_error` say what was built and
  whether it was written; `mesh_append` hands out the run_id only for a
  report that exists, keeps the store's counts under `written` and the
  reading's under `read`; `theogony mesh ingest` names the report and exits 1.
  Found by the review on the way: a reading whose paragraph concept names
  basis labels no concept carries rated its drops above 1 (the denominator
  left the basis labels out), QualityFlags refused the rate after every write
  had landed, and no report could be built for that error either; the basis
  labels are now in the denominator, and the failure builder falls back to
  default summaries rather than lose the report. Tests:
  tests/mesh/test_read_failure_report.py (fifteen) and two in
  tests/test_mcp_mesh_tools.py; mutations that retry a failed buffer or drop
  a failed audit row turn them red. Out of scope: a cancelled read
  (CancelledError and KeyboardInterrupt are BaseException) and a book whose
  download fails before the reader is reached.
relates_to:
  - PHX-1082   # the tick's version of the same repair
  - PHX-1112   # the MCP path this was found on
linked_scripts:
