id: PHX-1106
category: substrate-runtime
priority: high
status: done
generation_target: MESH doctrine — §6 Global homeostatic renormalisation
title: "Renormalisation: the counterforce the gate needs — measured −1.5 on held-out"
filed_by: Claude Code (2026-09-02, from the 2Wiki heartbeat)
created_at: 2026-09-02
description: >
  Since PHX-1102, decay spares what has fired. On 2Wiki, over 50 rounds, it
  does what it should — used questions +1.3 points with credit — and it has
  a price that grows monotonically: held-out questions fall by −1.5
  (0.813 → 0.798), with or without credit.

  The mechanism is visible: 5.4% of edges stay pinned at the ceiling, all
  others fall from 1.0 to 0.28. Because the operator reads proportions, the
  share of spared edges at every node grows 3.5-fold, and the random walk
  tips toward the used regions. What is not used is not merely forgotten,
  but displaced.

  MESH_SUBSTRATE §6 provides exactly for this: global homeostatic
  renormalisation — hold the total weight per node (or the ratio total
  weight/node count, R_ideal) stable, so that reinforcement shifts the
  distribution instead of crushing the rest. The inventory (PHX-1100) found
  it not built — a single hit in the repo, the docstring that says it is
  absent.

  It also fixes, incidentally, the inverted tier ladder (PHX-1100, pattern
  3): with weights allowed to live above 1, the documented modulation does
  the right thing again.

  SCOPE: a tick step after decay that scales, per node, the outgoing weights
  to a target sum (or globally to R_ideal), with the tier-aware softening
  from §6 as an option. Measured against the same heartbeat run: the
  hypothesis is that used stays at +1.3 and held-out no longer falls. If
  both fall, the target sum is wrong; if used falls, renormalisation eats
  the credit.

  In addition, from the run: a second confirmation on HotpotQA or MuSiQue,
  and a second seed, before 1–1.5 points count as an effect.
resolution: >
  Built and measured, 2026-09-12. Full text docs/etappes/renormalisation.md.

  Built: `renormalise_edges_inplace` in three readings of §6 -- global (one
  factor across all edges, set point as weight per node, anchored in
  mesh_state.json on first activation), out and in (per node, the sum of
  outgoing or incoming weights held at tick entry) --, as a tick step after
  decay and before saturation, as MESH_IMPLEMENTATION prescribes;
  tier-aware softening as an option;
  `mesh tick --renormalise global|out|in|off --renorm-scale`; the policies
  in the 2Wiki heartbeat and the founding heartbeat.

  Measured, the same heartbeat as PHX-1104, five policies, 50 rounds, delta
  against round 0 (used / held-out):

      2Wiki Seed 0     Baseline +1.3 / -1.5   global +1.2 / +1.5
      HotpotQA Seed 0  Baseline +0.3 / -2.3   global -0.7 / -0.7
      2Wiki Seed 1     Baseline -0.7 / -2.3   global -1.5 / +0.7

  What holds: the gate displaces, in every run; global renormalisation
  cancels that, in every run (on average 2.5 points on held-out) and costs
  on average half a point on used. What does not hold: the gain from
  PHX-1104 -- +1.3 was a seed. The plan's condition (used >= +1 and
  held-out >= 0 on both datasets and seeds) is met by no policy, because its
  first half is already met by the baseline only once. out halves the gain
  (+0.7 / 0), in only slows the drift.

  The mechanism, with a control: §6 as written is invisible to an operator
  that reads row-normalised adjacency -- without a cap, baseline and
  renormalisation are identical up to round 10, and after that
  renormalisation is an amplifier of displacement (-3.8 against -2.0),
  because the fired edges grow without a bound (max 41.9) and everything
  else is scaled down. The counterforce is the cap: scaling lifts the
  unused back up, w_max cuts off the used. Set-point sweep: at 1.0 the graph
  flattens (median 0.28 -> 0.95), at 0.9 the same counterforce with a
  median of 0.85 and half the price on HotpotQA, at 0.7 the counterforce is
  gone -> DEFAULT_RENORM_SCALE = 0.9.

  Shipped: `mesh tick` runs by default with global / 0.9; `run_minimal_tick`
  stays at None, the function is the primitive. The tier ladder remains
  untouched, because the weights continue to live below 1. For the
  doctrine: PHX-1108 (§6 without a cap is no counterweight).

  On the founding mesh itself (real tick, 10 rounds, 24/23 questions):
  baseline and renormalisation identical at every measurement point (87.9 /
  84.4% after round 1), because the weights there live below the cap;
  renormalisation holds the mass (median 0.293 instead of 0.276 after 10
  ticks). Measured as the default: harmless where the cap does not bite,
  and needed where it does.
