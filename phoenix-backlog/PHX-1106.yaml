id: PHX-1106
category: substrate-runtime
priority: high
status: done
generation_target: MESH doctrine — §6 Global homeostatic renormalisation
title: "Renormalisierung: die Gegenkraft, die das Gate braucht — gemessen −1,5 auf Zurückgehaltenem"
filed_by: Claude Code (2026-09-02, aus dem 2Wiki-Herzschlag)
created_at: 2026-09-02
description: >
  Seit PHX-1102 verschont der Zerfall, was gefeuert hat. Auf 2Wiki über 50
  Runden tut das, was es soll — benutzte Fragen +1,3 Punkte mit Gutschrift —
  und hat einen Preis, der monoton wächst: die zurückgehaltenen Fragen fallen
  um −1,5 (0,813 → 0,798), mit oder ohne Gutschrift.

  Der Mechanismus ist sichtbar: 5,4 % der Kanten bleiben am Anschlag, alle
  anderen fallen von 1,0 auf 0,28. Weil der Operator Anteile liest, wächst der
  Anteil der verschonten Kanten an jedem Knoten um das 3,5-fache, und der
  Random Walk kippt zu den benutzten Regionen. Was nicht benutzt wird, wird
  nicht nur vergessen, sondern verdrängt.

  MESH_SUBSTRATE §6 sieht genau dafür die globale homöostatische
  Renormalisierung vor: das Gesamtgewicht je Knoten (oder das Verhältnis
  Gesamtgewicht/Knotenzahl, R_ideal) stabil halten, damit Verstärkung die
  Verteilung verschiebt statt den Rest zu erdrücken. Die Inventur (PHX-1100)
  fand sie nicht gebaut — ein einziger Treffer im Repo, der Docstring, der sagt,
  dass sie fehlt.

  Sie repariert nebenbei die verkehrte Tier-Leiter (PHX-1100, Muster 3): mit
  Gewichten, die über 1 leben dürfen, tut die dokumentierte Modulation wieder
  das Richtige.

  UMFANG: ein Tick-Schritt nach dem Zerfall, der je Knoten die Ausgangsgewichte
  auf eine Zielsumme skaliert (oder global auf R_ideal), mit dem
  tier-bewussten Softening aus §6 als Option. Gemessen gegen denselben
  Herzschlag-Lauf: die Hypothese ist, dass benutzt +1,3 bleibt und
  zurückgehalten nicht mehr fällt. Wenn beides fällt, ist die Zielsumme falsch;
  wenn benutzt fällt, frisst die Renormalisierung die Gutschrift.

  Dazu, aus dem Lauf: eine zweite Bestätigung auf HotpotQA oder MuSiQue, und
  ein zweiter Seed, bevor 1–1,5 Punkte als Effekt gelten.
resolution: >
  Gebaut und gemessen, 2026-09-12. Volltext docs/etappes/renormalisation.md.

  Gebaut: `renormalise_edges_inplace` in drei Lesarten von §6 -- global (ein
  Faktor über alle Kanten, Sollwert als Gewicht je Knoten, beim ersten
  Einschalten in mesh_state.json verankert), out und in (je Knoten die
  Summe der Ausgangs- bzw. Eingangsgewichte vom Tick-Eintritt gehalten) --,
  als Tick-Schritt nach dem Zerfall und vor der Sättigung, wie
  MESH_IMPLEMENTATION es ordnet; tier-bewusste Milderung als Option;
  `mesh tick --renormalise global|out|in|off --renorm-scale`; die Politiken
  im 2Wiki-Herzschlag und im Founding-Herzschlag.

  Gemessen, derselbe Herzschlag wie PHX-1104, fünf Politiken, 50 Runden,
  Delta gegen Runde 0 (benutzt / zurückgehalten):

      2Wiki Seed 0     Baseline +1,3 / -1,5   global +1,2 / +1,5
      HotpotQA Seed 0  Baseline +0,3 / -2,3   global -0,7 / -0,7
      2Wiki Seed 1     Baseline -0,7 / -2,3   global -1,5 / +0,7

  Was hält: das Gate verdrängt, in jedem Lauf; die globale Renormalisierung
  hebt das auf, in jedem Lauf (im Mittel 2,5 Punkte auf dem Zurückgehaltenen)
  und kostet im Mittel einen halben Punkt auf dem Benutzten. Was nicht hält:
  der Gewinn aus PHX-1104 -- +1,3 war ein Seed. Die Bedingung des Plans
  (benutzt >= +1 und zurückgehalten >= 0 auf beiden Datensätzen und Seeds)
  erfüllt keine Politik, weil ihre erste Hälfte schon die Baseline nur einmal
  erfüllt. out halbiert den Gewinn (+0,7 / 0), in bremst die Drift nur.

  Der Mechanismus, mit Kontrolle: §6 wie geschrieben ist für einen Operator,
  der zeilennormalisierte Adjazenz liest, unsichtbar -- ohne Kappe sind
  Baseline und Renormalisierung bis Runde 10 identisch, und danach ist die
  Renormalisierung ein Verstärker der Verdrängung (-3,8 gegen -2,0), weil die
  gefeuerten Kanten ohne Grenze wachsen (max 41,9) und alles andere
  herunterskaliert wird. Die Gegenkraft ist die Kappe: die Skalierung hebt
  das Unbenutzte zurück, w_max schneidet das Benutzte ab. Sollwert-Sweep:
  bei 1,0 flacht der Graph ab (Median 0,28 -> 0,95), bei 0,9 dieselbe
  Gegenkraft mit Median 0,85 und halbem Preis auf HotpotQA, bei 0,7 ist die
  Gegenkraft weg -> DEFAULT_RENORM_SCALE = 0,9.

  Ausgeliefert: `mesh tick` läuft standardmäßig mit global / 0,9;
  `run_minimal_tick` bleibt bei None, die Funktion ist die Primitive. Die
  Tier-Leiter bleibt unangetastet, weil die Gewichte weiter unter 1 leben.
  Für die Doktrin: PHX-1108 (§6 ist ohne Kappe kein Gegengewicht).

  Auf dem Founding-Mesh selbst (echter Tick, 10 Runden, 24/23 Fragen):
  Baseline und Renormalisierung an jedem Messpunkt identisch (87,9 / 84,4 %
  nach Runde 1), weil dort die Gewichte unter der Kappe leben; die
  Renormalisierung hält die Masse (Median 0,293 statt 0,276 nach 10 Ticks).
  Als Standard gemessen harmlos, wo die Kappe nicht greift, und nötig, wo
  sie greift.
