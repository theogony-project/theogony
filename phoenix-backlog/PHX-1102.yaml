id: PHX-1102
category: substrate-runtime
priority: critical
status: done
generation_target: MESH doctrine — the five primitives
title: "Hebbian reinforcement is 17- to 254-fold too small against decay"
filed_by: Claude Code (2026-08-31, from the doctrine inventory)
created_at: 2026-08-31
description: >
  Measured, not calculated. Eight real queries with `hebbian=True` against
  `data/mesh-founding` wrote 512 deltas:

      strongest delta of one query       2.9e-4
      median delta                       1.9e-5
      one tick of decay (median weight 0.3112, λ=0.05, k=2)   4.8e-3

  **The strongest reinforcement a single query can give an edge is 17 times
  smaller than one tick of forgetting. 254 times in the median.** And the tick
  decays every edge, while a query only touches the ones it activates.

  On top of that, it has never run on this mesh: all 14 tick records carry
  `delta_drained: 0`, no script and no eval harness sets `--hebbian`. Every one
  of the 94,490 weights is pure ingestion plus decay.

  As long as that stands, "the substrate learns from use" is a claim its own
  parameters refute. Three knobs, and none of them may be guessed:

    - raise α (`hebbian_learning_rate`, currently 0.01)
    - lower λ (currently 0.05 per tick)
    - restrict decay to **unfired** edges, as doctrine actually says — which
      PHX-1101 is a prerequisite for

  The third is probably the right one, because it keeps to doctrine instead of
  trading one number for another. But it is also the only one that introduces a
  new dependency.

  MEASUREMENT PLAN: a simulation over N ticks at a realistic query volume,
  against the actual weight distribution of the Founding mesh — at which
  combination does a frequently queried edge hold its weight, without a never
  queried one becoming immortal? This is cheap and answers the question before
  the first code change.
resolution: >
  Measured, not argued — simulation over the real weight distribution
  (scripts/mesh_hebbian_calibration.py), 20 ticks, one round of 24 gold
  questions each:

      Policy                           10 most-fired      never fired
      Start                                 0.594             0.387
      A shipped                             0.359             0.270
      B α at doctrine scale                 0.363             0.270
      C gate: only unfired decays           0.594             0.270   <- shipped
      D B + C                               0.601             0.270
      E λ/10                                0.558             0.370

  THE GATE IS THE KNOB — the only policy where the used holds and the unused
  fades exactly as before. It is the rule MESH_SUBSTRATE §2 has held since day
  one; it never applied, because nobody wrote down what had fired (PHX-1101).

  SHIPPED: `decay_edges_inplace(fired=…)` + `fired_pairs()`; the tick pulls in
  both sidecars before decay and restores both on failure; `decay_gate=True`
  default, a no-op without a firing record (tested). `hebbian_normalize` as a
  lever, default off: alone +0.004, with the gate +0.007. λ unchanged — λ/10
  slows everything down and separates nothing.

  LIVE (scripts/mesh_heartbeat.py, 10 rounds): the gate does on the substrate
  what the simulation says — 15,732 edges spared, w_max holds 0.905 against
  0.616. Recall does not move in any variant. Why, and what the verb *learns*
  now means, is in PHX-1104.
relates_to:
  - PHX-1100   # the inventory
  - PHX-1101   # the firing signal the third option needs
