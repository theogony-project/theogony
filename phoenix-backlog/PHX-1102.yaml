id: PHX-1102
category: substrate-runtime
priority: critical
status: done
generation_target: MESH doctrine — die fünf Primitiven
title: "Die Hebbsche Verstärkung ist 17- bis 254-fach zu klein gegen den Zerfall"
filed_by: Claude Code (2026-08-31, aus der Doktrin-Inventur)
created_at: 2026-08-31
description: >
  Gemessen, nicht gerechnet. Acht echte Abfragen mit `hebbian=True` gegen
  `data/mesh-founding` schrieben 512 Deltas:

      stärkstes Delta einer Abfrage      2,9e-4
      Median-Delta                       1,9e-5
      ein Tick Zerfall (Mediangewicht 0,3112, λ=0,05, k=2)   4,8e-3

  **Die stärkste Verstärkung, die eine einzelne Abfrage einer Kante geben kann,
  ist 17-mal kleiner als ein Tick Vergessen. Im Median 254-mal.** Und der Tick
  zerfällt jede Kante, während eine Abfrage nur die berührt, die sie aktiviert.

  Dazu kommt, dass es auf diesem Mesh nie gelaufen ist: alle 14 Tick-Records
  tragen `delta_drained: 0`, kein Skript und kein Eval-Harness setzt `--hebbian`.
  Jedes der 94.490 Gewichte ist reine Ingestion plus Zerfall.

  Solange das so steht, ist "das Substrat lernt aus Benutzung" eine Behauptung,
  die die eigenen Parameter widerlegen. Drei Stellschrauben, und keine davon darf
  geraten werden:

    - α anheben (`hebbian_learning_rate`, aktuell 0,01)
    - λ senken (aktuell 0,05 je Tick)
    - den Zerfall auf **ungefeuerte** Kanten beschränken, wie die Doktrin es
      eigentlich sagt — was PHX-1101 voraussetzt

  Die dritte ist vermutlich die richtige, weil sie die Doktrin einhält statt eine
  Zahl gegen eine andere zu tauschen. Aber sie ist auch die einzige, die eine neue
  Abhängigkeit einführt.

  MESSPLAN: eine Simulation über N Ticks bei realistischem Abfragevolumen, gegen
  die tatsächliche Gewichtsverteilung des Founding-Mesh — bei welcher Kombination
  hält eine oft abgefragte Kante ihr Gewicht, ohne dass eine nie abgefragte
  unsterblich wird? Das ist billig und beantwortet die Frage vor der ersten
  Codeänderung.
resolution: >
  Gemessen, nicht argumentiert — Simulation über die echte Gewichtsverteilung
  (scripts/mesh_hebbian_calibration.py), 20 Ticks, je eine Runde von 24
  Gold-Fragen:

      Politik                          10 meistgefeuerte   nie gefeuert
      Start                                 0,594             0,387
      A ausgeliefert                        0,359             0,270
      B α auf Doktrin-Skala                 0,363             0,270
      C Gate: nur Ungefeuertes zerfällt     0,594             0,270   <- ausgeliefert
      D B + C                               0,601             0,270
      E λ/10                                0,558             0,370

  DAS GATE IST DIE SCHRAUBE — die einzige Politik, bei der Benutztes hält, und
  sie lässt Unbenutztes exakt so verblassen wie bisher. Es ist die Regel, die
  MESH_SUBSTRATE §2 seit dem ersten Tag enthält; sie galt nie, weil niemand
  aufschrieb, was gefeuert hat (PHX-1101).

  AUSGELIEFERT: `decay_edges_inplace(fired=…)` + `fired_pairs()`; der Tick zieht
  beide Sidecars vor dem Zerfall ein und stellt beide bei Fehlschlag wieder her;
  `decay_gate=True` Default, ohne Feuer-Record ein No-op (getestet).
  `hebbian_normalize` als Hebel, Default aus: allein +0,004, mit Gate +0,007.
  λ unverändert — λ/10 verlangsamt alles und trennt nichts.

  LIVE (scripts/mesh_heartbeat.py, 10 Runden): das Gate tut auf dem Substrat,
  was die Simulation sagt — 15.732 Kanten verschont, w_max hält 0,905 gegen
  0,616. Der Recall bewegt sich in keiner Variante. Warum, und was das Verb
  *lernt* jetzt heißt, steht in PHX-1104.
relates_to:
  - PHX-1100   # die Inventur
  - PHX-1101   # das Feuersignal, das die dritte Option braucht
