generation_target: MESH migration — S3 (answer quality)
title: "The unscoped relation list was worse than showing no relations at all"
filed_by: Claude Code (2026-08-26, working the answer-step gap)
created_at: 2026-08-26
description: >
  PHX-1087 measured that 62% of what retrieval delivers never reaches the answer.
  Three hypotheses tested against it. Two refuted, one shipped.

  REFUTED — the display name. Reading what the model actually receives for the
  questions it fails:

      cronus-children: "Who are the children of Cronus and Rhea?"
        Hestia   ->  "Vesta — Roman goddess of the hearth"
        Demeter  ->  "dear mother — The mother of the goddess"
        Hades    ->  "Host of Many — Epithet of Hades"
        Zeus     ->  "her father — Zeus, the father of Persephone"

  All four score as retrieved: `_name_index` resolves a gold name through **tags**
  while the Constellation displays the **description head**, which is whatever the
  mention was called. **29% of gold entities (32 of 111) are shown under a name
  other than the one they answer to**, and the canonical name is in the tags.

  The obvious fix makes it worse. Rendering the other names alongside scored
  **50% against 60%** on the same run: the tags carry wrong aliases — Hestia's
  include *Athena*, Death's include *entrance* — so surfacing them injects errors
  faster than it resolves names. The tag-quality problem is upstream of the
  renderer and stays there.

  REFUTED — hand over passages. HippoRAG converts 70-75% of what it retrieves into
  answers against 38% here, and the visible difference is that it hands over
  passages while this hands over names. That route is closed by doctrine:
  MESH_SUBSTRATE forbids raw text beyond the opaque `raw_text_ref`, naming
  "extracted paragraph bodies" and "multi-sentence source passages" specifically.
  The doctrine's read surface is the `description`, regenerated by Oneiros — which
  is S5, and the epithets above are exactly what an unconsolidated description
  looks like.

  SHIPPED — stop showing the whole graph. Answer recall, three runs per arm:

      none at all                            57 / 52 / 52
      every edge among the kept nodes        50 / 50 / 51   <- the old default
      ranked seed-first, not cut             52 / 52 / 53
      cut to the edges touching a seed       50 / 53 / 53

  **The unscoped list was the worst arm in six runs of six — worse than showing no
  relations at all.** 200 lines of everything-connected-to-everything, of which a
  median of 63 touch a seed.

  Two changes with different owners: the Constellation *ranks* seed-touching edges
  first, and the answer renderer *cuts* at them. Ranking alone does not recover
  the loss. The cut is the consumer's, because the Constellation's contract is the
  activated subgraph and not one reader's slice of it.

  Honest about the size: about three points, and the spread is nearly the size of
  the effect. The same arm through an ad-hoc renderer scored 56/53/56 — the only
  difference was the header wording, worth two to three points on this instrument
  (PHX-1087). The figures above are the shipped path's.

  WHERE THE GAP STANDS: retrieval 80%, answer ~53%, conversion 66% against 38%
  when this round began — but most of that came from the retrieval work
  (PHX-1091), not from closing the gap. What remains is not a rendering problem:
  the read surface is a per-mention description written by an extractor where the
  doctrine specifies a consolidated one. **That is S5** — the same answer PHX-1064
  reached from the retrieval side.

resolution: >
  Constellation ranks seed-touching edges first; the answer renderer cuts at them.
  Worth about three points, on an instrument whose prompt-wording noise is two to
  three. The two refuted hypotheses are recorded with their numbers: showing a
  node's other names scores 50% against 60% because the tags carry wrong aliases,
  and handing over source passages is forbidden by MESH_SUBSTRATE. The remaining
  gap is the unconsolidated description, which is S5.
