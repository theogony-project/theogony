id: PHX-1055
category: ingestion-robustness
priority: high
status: in_progress
generation_target: MESH migration — ingestion provider tolerance (S2)
title: "Kadmos ingestion produces nothing on providers that do not honour the JSON schema"
filed_by: Claude Code (found by the PHX-1052 live characterization test, 2026-08-16)
created_at: 2026-08-16
description: >
  MeshParagraphReader validated the LLM response with a strict
  ParagraphReadingOutput.model_validate_json(). Providers that do not enforce the
  supplied JSON schema return the right content under different field names —
  DeepSeek answers with name / wikidata_id / subject / predicate / object — so
  every paragraph raised a validation error, was counted in llm_schema_failures,
  and contributed nothing. Ingestion completed "successfully" while producing only
  source-anchor scaffolding and zero concepts.

  Measured: `theogony mesh ingest` with THEOGONY_LLM__PROVIDER=deepseek on the
  Hesiod foam-birth passage logged "LLM paragraph reading failed: 51 validation
  errors for ParagraphReadingOutput" and yielded no entities. deepseek is a
  first-class provider in settings/factory and the cheapest one available
  (0.14/0.28 USD per MTok), so this silently removed the whole low-cost ingestion
  path.

  Found by the live characterization layer added for PHX-1052 — the mock-based
  tests could not see it, because the stub returns canonical field names by
  construction. This is exactly the failure mode AGENTS.md §3 names: mock-only
  tests are never sufficient for a default LLM.

  Fix (this ticket's PR): normalize_reading_payload() maps known provider field
  aliases onto the schema before validation and drops unknown keys, so an
  extraction that got the *content* right but the *spelling* wrong survives;
  anything structurally unusable (missing label, missing relation endpoints) still
  fails validation. The function moved from the benchmark harness, where it had
  been written for the same reason, into mesh/ingestion/reading_schemas.py so the
  production path and the eval path share one implementation.

  Verified: the live characterization test passes against deepseek-chat after the
  fix and failed before it.

resolution: >
  The core fix shipped in aec77f4 (PR #206) and is reached in production: normalize_reading_payload (reading_schemas.py:149) runs at kadmos_v2.py:847 before the strict validate, so DeepSeek's name/subject/predicate/object readings now survive instead of failing on every paragraph. Two parts did not land: the eval path does not in fact share the implementation — scripts/mesh_qa_kadmos.py:64 still imports the function from theogony.mesh.eval.qa_retrieval, where the same commit deleted it, so the benchmark script raises ImportError on start; and `wikidata_id`, one of the four DeepSeek aliases the ticket names, is not mapped to `qids`, so provider Q-IDs are dropped.
remaining: >
  Two things. (1) The YAML's claim that the function "moved from the benchmark harness ... into mesh/ingestion/reading_schemas.py so the production path and the eval path share one implementation" is only half true: the move deleted normalize_reading_payload from src/theogony/mesh/eval/qa_retrieval.py without updating scripts/mesh_qa_kadmos.py:64, which still imports it from there. The eval path does not share the implementation — it cannot import at all (ImportError verified). The one-line import fix (point it at theogony.mesh.ingestion.reading_schemas, where scripts/mesh_qa_kadmos.py:67 already imports ParagraphReadingOutput from) is outstanding, plus something that would catch it (no test imports the script). (2) `wikidata_id`, one of the four DeepSeek field names the YAML itself lists, has no alias to `qids`, so DeepSeek's Q-IDs are silently discarded — the extraction that "got the content right but the spelling wrong" survives without its identity evidence, which is exactly the content the concept normalisation was supposed to rescue.
