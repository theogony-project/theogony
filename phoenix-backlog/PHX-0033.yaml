acceptance_criteria:
  - A documented procedure to download / install / serve the curated
    Wikidata subset locally (Docker or systemd, both acceptable).
  - The subset covers, at minimum:
    1. All entities of type ``Q5`` (human) with at least one
       ``P19/P20/P119`` (place of birth/death/burial) **or** a
       ``P106`` (occupation) in {explorer, geographer, surveyor,
       cartographer, mountaineer, naturalist, missionary,
       diplomat, military officer, head of state}.
    2. All entities of type ``Q515`` (city), ``Q3957`` (town),
       ``Q486972`` (human settlement), ``Q6256`` (country),
       ``Q15642541`` (historical region), ``Q8502`` (mountain),
       ``Q4022`` (river), ``Q23397`` (lake), ``Q165`` (sea),
       ``Q4421`` (forest), ``Q39594`` (desert), ``Q7777019`` (pass).
    3. All entities of type ``Q43229`` (organization) with the
       ``P31/P279`` chain leading to "scientific society",
       "geographic society", "expedition", or "publishing house".
    4. All entities of type ``Q571`` (book) and ``Q47461344``
       (written work) published before 1950 with a P407 (language)
       in {en, de, fr, it, sv, ru, zh, hi}.
    5. All ``P460`` (said-to-be-the-same), ``P1889`` (different-from)
       edges between members of the above sets, plus ``P31``,
       ``P279``, ``P361``, ``P527`` (taxonomic ancestry).
    6. Multi-language labels + aliases for sets 1-4 in
       {en, de, fr, it, sv, ru} (the AliasMatcher + Tier 2 path
       depends on these).
  - ``WikidataClient`` switches transparently between live
    ``query.wikidata.org`` and the local subset behind a
    ``Settings.wikidata.endpoint = "live" | "local"`` toggle
    (default ``"local"`` once the subset is provisioned).
  - The W5 reference run (Hedin #43497 full unbounded) completes
    in ≤ 60 min wall-clock against the local subset (vs. the
    measured ~480 min projection against the live endpoint).
  - The travel-literature subset is reproducible: a single
    versioned shell script regenerates it from a public Wikidata
    dump in ≤ 6 hours of one-time work.

