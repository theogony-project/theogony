id: PHX-0033
category: infrastructure
priority: high
status: open
generation_target: 2
title: "Pre-curated Wikidata subset for travel literature — remove live-SPARQL dependency"
filed_by: daedalus
created_at: 2026-04-17
updated_at: 2026-04-20
description: |
  The §3.4 v3 EntityResolver pipeline depends on the live Wikidata
  SPARQL endpoint (``query.wikidata.org``) plus ``wbsearchentities``
  for every mention. The free public endpoint is rate-limited and
  bursty; for any non-trivial corpus the resolver throughput is
  bottlenecked by Wikidata, not by anything in our pipeline.

  A curated, locally-hosted subset (~10 GB of places + persons +
  organisations + works relevant to travel literature, plus
  alias-tables) would (a) remove the rate-limit ceiling entirely,
  (b) eliminate cold-network latency, (c) give us deterministic
  reproducible offline ingest, (d) unblock the W5-style "full
  unbounded book" runs that are currently structurally infeasible.

  Originally filed as a Plan §11 forward-looking item (Daedalus,
  2026-04-17). Updated 2026-04-20 with measured Wikidata-throttle
  evidence from the W5 Anthropic full-ingest validation run — see
  the *Measured evidence* block below.

related:
  - PHX-0024  # self-hosted Wikidata mirror (parent superset; this is the travel-literature carve-out)
  - PHX-0034  # entity-resolution quality benchmark (depends on this for offline reproducibility)
  - PHX-0027  # LLM provider re-evaluation (independently bottlenecked when running cross-provider sweeps)

