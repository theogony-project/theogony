id: PHX-0048
category: performance
priority: medium
status: open
generation_target: 1
title: "KnowledgeStore.batch_update_scores — bulk score writes for OneirosWorker"
filed_by: daedalus
created_at: 2026-04-19
description: |
  Originally filed (2026-04-19) as "Neo4jKnowledgeStore.update_scores
  collapses to one round-trip via Cypher COALESCE", deferred to Gen 2
  because the single-node COALESCE shape couples the vitality formula
  to Cypher and frustrates PHX-0009's freedom to evolve the formula
  empirically.

  Reopened by E8.5 design (2026-04-19) — see
  docs/etappes/E8.5_brief_daedalus.md Q5 and Plan §5 E8.5.
  Generation target moved Gen 2 → Gen 1 because the OneirosWorker's
  full-sweep tick over EPHEMERA at the demo's ≤ 2000-node retention
  surface needs O(1) write round-trips per tick, not O(N): with the
  original per-node update_scores at ~5 ms per Bolt round-trip,
  N=2000 gives ~10 s per tick, exceeding any reasonable share of the
  60-s tick interval and making the demo's "feels alive" UX
  observably laggy.

  REFINED IMPLEMENTATION SHAPE (the change that re-opens this ticket):

  Drop the single-node Cypher COALESCE shape. Add a NEW Protocol
  method that accepts a batch of updates with PRECOMPUTED vitality:

      class ScoreUpdate(BaseModel):
          node_id: str
          confidence: float | None = None
          relevance: float | None = None
          connectivity: float | None = None
          freshness: float | None = None
          vitality: float | None = None  # precomputed by caller

      class KnowledgeStore(Protocol):
          ...
          async def batch_update_scores(
              self, updates: Sequence[ScoreUpdate]
          ) -> None: ...

  Cypher (Neo4j override):

      UNWIND $rows AS r
      MATCH (n:KnowledgeNode {id: r.node_id})
      SET n.confidence   = COALESCE(r.confidence,   n.confidence),
          n.relevance    = COALESCE(r.relevance,    n.relevance),
          n.connectivity = COALESCE(r.connectivity, n.connectivity),
          n.freshness    = COALESCE(r.freshness,    n.freshness),
          n.vitality     = COALESCE(r.vitality,     n.vitality)

  InMemory fallback: iterate updates, look up node, apply non-None
  fields, write back (no race because in-process).

  Why this shape sidesteps the original deferral:

  1. NO formula in Cypher. The vitality column is written from the
     pre-computed value the caller passed in. PHX-0009 changes the
     formula in core/model.py NodeScores.vitality(); Cypher does not
     care. The original PHX-0048 shape (Cypher COALESCE with weights
     as parameters) DID couple the formula to Cypher; this shape
     does not.

  2. ATOMIC at the bulk level. The single Cypher statement holds
     one transaction across all N nodes; concurrent
     RelevanceTracker.bump calls (which use the existing per-node
     get_node + upsert_node pattern) interleave at single-node
     granularity. Because the bulk write touches connectivity /
     freshness / vitality but NOT relevance (the worker does not
     mutate relevance), the bump's relevance update survives the
     race in the worst case. Documented in Plan §5 E8.5
     "Race-condition note (Q5)".

  3. PERFORMANT for the worker's actual workload. One round-trip
     per tick instead of N. At demo scale (N=2000, tick=60 s) the
     write cost drops from ~10 s to ~5-50 ms.

  Acceptance:

    - `ScoreUpdate` Pydantic model added (likely in core/model.py
      next to NodeScores, or a new core/store_models.py if Daedalus
      prefers separation; Talos picks).
    - `KnowledgeStore.batch_update_scores(updates: Sequence[ScoreUpdate])`
      added to Protocol with default fallback implementation.
    - `InMemoryKnowledgeStore` implements via per-node in-process
      apply.
    - `Neo4jKnowledgeStore` overrides with the UNWIND+COALESCE Cypher
      above. PROFILE confirms one MATCH per row, range-index served
      via the existing :KnowledgeNode(id) index.
    - Contract suite extended (one new parametrised test): seed N
      nodes with known scores, batch_update_scores with a mix of
      partial / full updates, verify all updates landed, verify
      unmodified fields stayed.
    - Convergence test (Plan §5 E8.5 Q5): one test that interleaves
      a RelevanceTracker.bump between two worker tick yields and
      asserts the bumped relevance survives. This is the
      "documented race converges on next tick" pin.
    - Microbenchmark in the docstring (or a gated test): N=200
      nodes, batch_update_scores vs N per-node update_scores calls
      against testcontainers Neo4j, target ≥ 20× speedup
      wall-clock. Reject if < 5×.
    - The original `update_scores(node_id, scores: dict[str, float])`
      stays in the Protocol for RelevanceTracker.bump's reactive
      single-node use case; it is NOT removed. Both methods coexist.

  Out of scope:

    - Vitality-formula evolution itself (PHX-0009).
    - Locking the vitality formula's SHAPE (weighted sum vs. other).
      Because Cypher only stores precomputed numbers, the shape can
      evolve freely on the Python side.
    - Removing the per-node update_scores. RelevanceTracker.bump
      remains single-node + reactive; bulk would be over-engineering
      a code path that fires at most once per cited node per query.

  YAGNI guard preserved: the bulk method exists ONLY because
  E8.5's full-sweep tick generates the workload that justifies it.
  No speculative bulk APIs for code paths that don't have a
  concrete consumer.

