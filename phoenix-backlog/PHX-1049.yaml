id: PHX-1049
category: substrate-topology
priority: medium
status: in_progress
generation_target: MESH migration — edge-budget discipline before scale
title: "Cap the structural chunk lattice: k-NN sparsification of shares_entities_with"
filed_by: Claude Code (founding-mesh topology analysis, 2026-07-16)
created_at: 2026-07-16
description: >
  The structural paragraph lattice grows quadratically with paragraphs per
  source and crowds out the semantic edge budget. Measured on the founding
  mesh (292 nodes / 13,260 edges): shares_entities_with alone is 6,724 edges
  (51% of all edges); the in-degree histogram shows a distinct bump of ~92
  nodes in the 64-127 bin — the chunk layer forming a quasi-clique. The same
  mechanism at full-corpus scale (1,200+ paragraphs/source) means O(C^2)
  structural edges, while the vision's ~1000x edge density target is meant to
  carry *meaning* (MESH_SUBSTRATE edge dynamics operate on semantic weight).

  Positive side, also measured: the lattice is why the founding mesh is one
  connected component with zero isolated nodes. The fix must keep that
  property.

  Design sketch: cap structural neighbors per chunk at top-k by
  shared-entity weight (k configurable, e.g. 8-16); the remaining structural
  affinity is mediated through the shared concept nodes themselves (which is
  where the doctrine wants connectivity to live anyway). A/B on the emergent
  judge + connectivity metrics (LCC ratio, isolated-node count must not
  regress) before/after.

  Doctrine note: MESH_SUBSTRATE governs edge behaviour — this is a
  topology-shaping change and is flagged for doctrine review per AGENTS §6,
  not applied silently.

resolution: >
  The k-NN cap shipped and is live: each paragraph keeps its top-12 entity-sharing partners (union selection, `--structural-neighbours`, 0 = uncapped control), dropped pairs audited, connectivity preserved and pinned by 7 tests — measured -16.5% edges and -27.0% on the relations stage, but only -7.2% total, since entity resolution is 54% of the run. Outstanding: the emergent-judge A/B the ticket required was never run (and no LCC ratio was reported for either arm), and the flagged MESH_SUBSTRATE doctrine review has no record in the repo.
remaining: >
  Two things the YAML asks for that have no evidence of happening. (1) The quality half of its acceptance criterion: "A/B on the emergent judge + connectivity metrics (LCC ratio, isolated-node count must not regress) before/after." Only the connectivity half was measured, and only partly — the isolated-node anomaly was compared across arms, the LCC ratio was never reported for either arm, and no emergent-judge run exists for this change even though scripts/mesh_emergent_judge.py is the repo's standard A/B instrument. This is the criterion that would show whether deleting 16.5% of edges costs retrieval quality, which is the whole risk of the change. (2) The doctrine step: "MESH_SUBSTRATE governs edge behaviour — this is a topology-shaping change and is flagged for doctrine review per AGENTS §6, not applied silently." Commit 57af91e changed no doctrine document, PR #211's body contains no doctrine flag, and no MESH doc mentions the cap; the change is currently on by default with the doctrine trail existing only in a code comment (kadmos_v2.py:58-64). Also outstanding as bookkeeping: the YAML lacks `resolution:` and `linked_prs: [#211]`, and docs/PHOENIX_BACKLOG.md:37 still says `open`.
linked_prs:
