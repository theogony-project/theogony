id: PHX-1070
category: substrate-retrieval
priority: high
status: measured_and_shipped_as_a_lever
generation_target: MESH migration — S3 (retrieval quality)
title: "Proposal: relation-type-aware propagation — the doctrine has no mechanism for it"
filed_by: Claude Code (measured, not built, 2026-08-20)
created_at: 2026-08-20
description: >
  PROPOSAL, deliberately not implemented. It would be a new retrieval mechanism
  and MESH_RETRIEVAL does not describe one: its primitives are Spreading
  Activation, diversified injection (MMR, weight-class, sub-mesh), three-factor
  reinforcement learning and frame-sensitive resonance. `relation_descriptor` is
  read only for display. Building it unilaterally would be routing around the
  doctrine rather than extending it (AGENTS.md §6).

  WHY IT KEEPS COMING UP. Two independent measurements point at it:

  1. Edge policy cannot be decided globally. Removing co-occurrence edges is
     +4 points on genealogical questions and -10 on narrative ones (PHX-1066).
     Proximity is what "why did X do Y" needs; typed relation is what "whose
     children are these" needs. One graph, two useful views.
  2. Ceiling test on the genealogical subset: restricting propagation to the
     1,200 kinship-descriptor edges of 94,490 takes recall from 58% to 66%.
     That used oracle knowledge — the question type was known and the edge types
     were hand-picked — so it is a ceiling, not a result.

  SHAPE IT WOULD TAKE, if adopted. Embed the relation descriptors and compare
  them to the query embedding, so the query selects which *kinds* of connection
  conduct rather than which nodes activate. No rule table, no classifier: the
  same embedding machinery already in the substrate, applied to edges instead of
  nodes. That is close in spirit to frame routing, which scales edges by the
  epistemic consistency of their endpoints — this would scale them by the
  relevance of their relation.

  WHAT WOULD ARGUE AGAINST IT. The descriptor vocabulary is not clean: 127
  kinship-ish descriptors, with `father_of` (190) beside `father of` (58) and
  `son_of` (180) beside `son of` (41). The same relation in two spellings splits
  its weight. Normalising descriptors at extraction may be worth more than any
  propagation change, and is a smaller intervention.

  Also: the gold set leans genealogical because the corpus does. A mechanism
  tuned on it could overfit to one question shape. Any adoption should be
  measured per question type, not on the aggregate — that discipline is what
  caught the co-occurrence trap.

  RESOLVED 2026-08-25, and smaller than proposed. The mechanism sketched above —
  embed the relation descriptors, let the query select which kinds conduct — was
  not needed. A plain multiplier on edges whose relation already resolves to a
  Wikidata property gets most of it, with no classifier, no descriptor embedding
  and no new primitive.

  The old ceiling number is superseded. "58% -> 66% restricting propagation to
  kinship edges" was measured before name anchors and at top_k=30; the baseline
  has since moved to 74% at top_k=50, above that ceiling. Re-measured at today's
  baseline, all three graphs at equal tick count:

      graph                              total  geneal.  narrat.
      full (baseline)         94,490       74%      64%      81%
      typed edges only         1,237       76%      89%      67%
      kinship oracle           1,303       77%      93%      66%

  Two things in there. 1.3% of the edges beat the whole graph on aggregate. And
  the curated P-ID table lands within four points of a hand-picked kinship
  oracle — the table is doing real work, not approximating it.

  BUT SELECTING IS THE WRONG OPERATION. It costs the narrative questions
  fourteen points, because the typed subgraph reaches only 121 of 163 gold
  entities. Weighting keeps every node reachable and only reorders. Measured
  through the shipped lever:

      boost      1      3     10     30    100
      total     74%    79%    80%    80%    78%
      geneal.   68%    76%    77%    77%    75%
      narrat.   86%    86%    86%    86%    86%
      full     33/47  36/47  35/47  35/47  33/47

  (Split re-measured 2026-08-26 against the checked-in `kind` field. The first
  version of this table split by a regex written at the point of measurement and
  its genealogical/narrative columns did not reproduce; the aggregate row is
  unchanged, because the aggregate never depended on the labelling.)

  At 3, three questions improve and none regress. `iapetus-sons` goes 0/3 to
  3/3, `cronus-children` 3/5 to 5/5 — enumerations, where the answer is a set
  of siblings that typed edges connect directly.

  CONTROLS, because "typing is informative" was not the only fit. Against an
  edge-level boost of 30: all 6,388 asserted edges gives 78%, a random 1,237
  asserted edges gives 76%, the 1,237 typed ones give 82%. Part of the effect is
  merely asserted-beats-structural — but typed beats a same-size random sample
  by six points, so the Wikidata typing carries its own signal.

  WHAT THIS COST TO FIND. The first version of the lever did nothing at all,
  because `descriptor_index` reported 7 typed edges where the store held 1,420.
  That turned out to be PHX-1078: 99% of typed node pairs were displaying their
  co-mention. The retrieval work found a correctness bug that had been in every
  Constellation the substrate ever returned.

  STILL OPEN, and named rather than quietly dropped: the lever is pair-level,
  because the typing is read from a pair-keyed index. Boosting only the typed
  edge itself scores two entities better (91 vs 89 of 111) and needs the
  descriptor as a column on the edge table. Two entities did not justify the
  migration today.

  DEFAULT OFF, and the stated reason has since been corrected. It read "the gold
  set is 66% genealogical, exactly the shape this lever favours" — a share
  carried over from the 32-question set that PHX-1073 retired. With the labelling
  checked in (PHX-1080) the share is 55% by question, 68% by entity, and the
  split columns above were re-measured against it: narrative recall is FLAT at
  86% for every boost, so the lever costs those questions nothing rather than
  trading them away. The bias argument does not carry the decision on its own.

  What does: one corpus, one gold set, and it moves exactly one question kind. A
  default that helps genealogy and does nothing else is a default tuned to
  Hesiod. It ships with its measurements attached, like `degree_beta` and
  `hub_mask_top_n`.

