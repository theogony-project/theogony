id: PHX-1112
category: agent-surface
priority: high
status: done
generation_target: MESH — consumption (MESH_RETRIEVAL step 5) over MCP
title: "The mesh has no MCP surface, and no keyless way to obtain a workspace"
filed_by: Claude Code (2026-09-17, from PHX-1111)
created_at: 2026-09-17
description: >
  PHX-1111 made the documented entrance work without an API key. It opens onto
  the Generation-1 layer. Everything measured since July — retrieval recall on
  the founding corpus, the memory of contradiction, renormalisation, the 2Wiki
  answer arm — lives in the MESH substrate, and an arriving agent cannot go
  there: the MCP server speaks only to the Gen-1 KnowledgeStore, and a mesh
  workspace can only be produced by reading, which needs an LLM key.

  Three pieces. (1) MCP tools over a MeshRuntime workspace: a mesh_ask that
  returns the Constellation retrieve() produces — entities with descriptions
  and activation, typed relations (structural descriptors left out, PHX-1110),
  source anchors, and the frames and contradiction edges PHX-1107 added — and
  a mesh_status with node, edge and tick counts. No LLM on this path at all.
  (2) A keyless demo mesh: recorded Kadmos readings of a public-domain corpus
  (the founding corpus is Hesiod in Evelyn-White's translation), shipped as a
  small compressed file and replayed through the shipped write path with the
  ReplayReadingProvider from PHX-1110 — a real mesh, from the real reader, in
  about a minute, deterministic. (3) The bundled Gen-1 self-description dates
  from 2026-04-20 and answers questions about this repository as it was before
  the mesh existed; refresh it or replace it with a mesh read of the current
  documents.
acceptance: >
  Three separable pieces, each its own PR. (1) mesh_ask and mesh_status
  answer a protocol round trip against a small replayed mesh — the fixture in
  tests/mesh/eval/test_qa_mesh.py builds one in a second — with no LLM
  anywhere on the path. (2) scripts/fresh_clone_probe.sh, extended, builds a
  demo mesh from shipped readings and gets a Constellation out of it, in
  under three minutes, without any API key. (3) Asking the bundled
  self-description what this project has measured returns something written
  after April 2026.
resolution: >
  All three pieces shipped, 2026-10-17; full text docs/etappes/mesh_over_mcp.md.

  (1) mesh_ask and mesh_status over a MeshRuntime workspace: the Constellation
  retrieve() produces, plus `material`, the rendering the answer benchmark
  measured; frame routing by profile; a MeshQueryRunReport per call; no LLM
  on the path. `theogony mcp --mesh-root`, default {data_dir}/mesh when a
  workspace is there; the server never creates one and refuses before the
  handshake when the named one is missing or in another embedder's space.

  (2) `theogony mesh demo`: the Kadmos readings of Hesiod's Theogony (95
  paragraphs) recorded once with deepseek-chat (EUR 0.03, 50 KB) and replayed
  through the shipped reader into the default workspace — from a fresh clone
  with no keys, 56 s to 723 nodes and 17,507 edges, and mesh_ask over MCP in
  0.2 s with 51 nodes and 200 edges. The replay is a shipped path
  (mesh/ingestion/replay.py) with a recorder (scripts/record_demo_readings.py).

  (3) The bundled self-description is regenerated from the current documents
  with the measurement record in scope — 16 etappes and their index, the
  sprint briefs left out because a plan read back states a target as a fact —
  735 nodes and 3,010 edges against 278 and 1,168. Asked what the project has
  measured it cites the etappes where the April dump cited the Gen-1
  implementation plan; a test pins it.

  Left for later, not filed: a self-description that is a mesh read of the
  documents rather than a Gen-1 dump. It needs a key to produce and would be
  the fourth corpus to record; the replay makes it shippable the same way.
linked_prs:
  - "#282 mesh_ask / mesh_status over MCP (piece 1)"
  - "#283 theogony mesh demo — the keyless demo mesh (piece 2)"
  - "the self-description regenerated with the measurement record (piece 3; number added when opened)"
