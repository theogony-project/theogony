id: PHX-0049
category: packaging
priority: medium
status: resolved
generation_target: 1
title: "AnswerSynthesizer system prompt not packaged for non-editable installs"
filed_by: daedalus
created_at: 2026-04-19
resolved_at: 2026-04-19
linked_prs:
  - "PR #24 — bundled production-readiness merge (PHX-0042 + PHX-0046 + PHX-0049 + PHX-0050)"
description: |
  AnswerSynthesizer (E8, src/theogony/retrieval/synthesize.py) loads
  its system prompt from a path computed relative to the module
  file:

      _DEFAULT_PROMPT_PATH = (
          Path(__file__).resolve().parents[3]
          / "prompts" / "answer_synthesizer.md"
      )

  This works for `pip install -e .` and the docker-compose dev
  workflow because `prompts/` lives at the repo root, three
  parents up from `src/theogony/retrieval/synthesize.py`. It
  BREAKS for `pip install theogony` from a wheel: hatchling's
  `[tool.hatch.build.targets.wheel] packages = ["src/theogony"]`
  only includes the package directory, so `prompts/` is not in
  the installed artifact. AnswerSynthesizer construction will
  raise FileNotFoundError on first use.

  This is not a hypothetical: E9 ships the FastAPI app and the
  `theogony serve` CLI command, both of which a downstream user
  would reasonably install via `pip install theogony` once the
  package is on PyPI. The current state is "we can demo, you
  cannot deploy".

  Two options:
    A. Move the prompt: `prompts/answer_synthesizer.md` →
       `src/theogony/retrieval/prompts/answer_synthesizer.md`,
       load via `importlib.resources.files`. The prompt becomes
       part of the package; wheel installs work. Cost: one
       file move + one loader rewrite (~10 lines).
    B. Keep prompts/ at the repo root, add `[tool.hatch.build]
       include = ["prompts/**"]` plus `[tool.hatch.build.targets.wheel]
       artifacts = ["prompts/**"]`. The prompt is shipped alongside
       the package, accessed via the same `parents[3]` logic as
       today. Cost: pyproject.toml edit only; downside is that the
       relative-path computation becomes install-layout-fragile
       (different wheel layouts on Windows / older pips).

  Hesiod recommends Option A — the importlib.resources idiom is
  the standard for shipping data files inside a Python package,
  and the AnswerSynthesizer is the only consumer (the prompt is
  not used outside the synthesizer).

  Acceptance:
    - `pip install .` (NOT -e) into a fresh venv, then a Python
      one-liner that constructs an AnswerSynthesizer with default
      prompt_path → no FileNotFoundError.
    - The existing `tests/test_retrieval_synthesize.py::TestPromptLoading`
      tests stay green, with `_DEFAULT_PROMPT_PATH` updated to
      whatever the chosen option uses.
    - One new test (`test_synthesizer_prompt_packaged`) that uses
      `importlib.metadata` or a subprocess-spawned `pip install
      .` in a tmp venv to assert the prompt file is in the
      installed layout. Skip on CI environments without `pip`
      write access.
    - README quickstart updated to NOT recommend `pip install -e .`
      as the only path; `pip install theogony` becomes valid once
      this lands.

  Out of scope:
    - Multi-prompt packaging (we have exactly one prompt file).
    - Prompt versioning / hot-reload (Gen 2; PHX-0035 territory).

  YAGNI guard: this ticket does NOT block E9 — Talos can ship the
  CLI against the editable-install layout. It DOES block "the
  first contributor who runs `pip install theogony` from PyPI",
  which is a Gen-1 success criterion (Plan §5 Week 4: README
  quickstart pip-installable).

reopen_trigger: |
  Implement before the first PyPI release of theogony, or before
  any docker image is built that does NOT use the editable-install
  pattern. Whichever comes first.

related:
  - PHX-0035  # Reviewer agent — prompt management surface
resolution: |
  Resolved 2026-04-19 in PR #24 via Hesiod's recommended Option A.

  Implementation:
    - Prompt moved from repo-root `prompts/answer_synthesizer.md`
      to packaged `src/theogony/retrieval/prompts/answer_synthesizer.md`.
    - `src/theogony/retrieval/prompts/__init__.py` added to make
      the directory a proper Python sub-package.
    - `AnswerSynthesizer.__init__` now loads the prompt via
      `importlib.resources.files("theogony.retrieval.prompts")
       .joinpath("answer_synthesizer.md").read_text(encoding="utf-8")`
      with explicit `prompt_path` parameter as a test-time override.
    - `pyproject.toml` carries
      `[tool.hatch.build.targets.wheel.force-include]` for the
      `.md` file so non-editable wheel installs ship the prompt.

  Tests:
    - `tests/test_retrieval_synthesize.py::test_default_loads_packaged_prompt_via_importlib_resources`
      verifies the default path uses the packaged location.
    - `tests/test_retrieval_synthesize.py::test_synthesizer_prompt_packaged`
      verifies the prompt resource is reachable via importlib.resources
      (proxies the wheel-install behaviour without a subprocess pip
      install — the resource API is the same in editable + wheel modes).

  README quickstart no longer carries the editable-install caveat;
  `pip install theogony` becomes valid once the package lands on PyPI.

  Closure rationale:
    - All acceptance criteria met (importlib.resources idiom in place,
      no FileNotFoundError under wheel layout, README updated).
    - No follow-up tickets needed; multi-prompt packaging and
      hot-reload remain Gen-2 concerns per the original out-of-scope
      list (PHX-0035 territory).
