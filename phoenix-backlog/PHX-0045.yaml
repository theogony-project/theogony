id: PHX-0045
category: tooling
priority: medium
status: open
generation_target: 1
title: "pytest-xdist parallel test execution with explicit `serial` marker"
filed_by: daedalus
created_at: 2026-04-19
description: |
  The test suite is at 625+ tests (per E6 RunReport) and growing.
  Local full-suite wallclock on Jakob's M4 Pro (14 cores) is
  several minutes; CI on GitHub-hosted runners is 2-3 minutes per
  matrix leg. Most tests are pure-Python unit tests with zero
  shared state — the canonical pytest-xdist target.

  Approach (hardware-agnostic, per Hesiod's anti-hardware-coupling
  guidance):
    - Add `pytest-xdist` to the `[dev]` extras.
    - Configure pytest with `-n auto` as the default in CI and a
      documented opt-in locally (`pytest -n auto`). `auto` picks
      one worker per logical CPU; on a 4-core CI runner that's 4
      workers, on the M4 Pro that's 14 — no hardware-specific code.
    - Introduce one new pytest marker, `@pytest.mark.serial`, for
      tests that are NOT safe to parallelise:
        * Anything writing to the same Neo4j database (the
          contract suite + live tests share one container; per-test
          DETACH DELETE assumes serial execution).
        * Anything using shared filesystem fixtures (e.g. SQLite
          audit-log tests writing to a shared temp file — audit
          which use isolated tmpdirs vs shared paths).
        * Anything reading shared environment state in a way
          parallel workers would race on.
    - Apply `-m "not serial"` to the parallel job, run a small
      `-m serial` job sequentially after.

  Acceptance:
    - First-pass audit: list every test file that touches Neo4j,
      SQLite, or shared filesystem state. Mark them `@pytest.mark.serial`.
    - CI matrix leg `Tests (Python 3.12)` and `Tests (Python 3.13)`
      run with `-n auto -m "not serial"`, then a small follow-up
      step runs `-m serial` sequentially.
    - Wallclock improvement target: ≥2× on the 14-core M4 Pro,
      ≥1.3× on the GitHub runner. Reject if no measurable speedup.
    - Documentation: README quickstart's `pytest -q` line gains a
      `# add -n auto for parallel execution` comment.

  Out of scope:
    - Custom worker counts (no -n 14, no hardware coupling).
    - pytest-xdist-specific fixtures like `worker_id` — if a test
      needs them, it's serial.

reopen_trigger: |
  Test suite wallclock blocks development OR the suite passes 1000
  tests (whichever first).

