generation_target: MESH doctrine — "the mesh is alive", das Verb *lernt*
title: "Das Substrat hält jetzt, was es benutzt — und das Retrieval sieht es nicht"
filed_by: Claude Code (2026-09-01, aus dem PHX-1102-Herzschlag)
created_at: 2026-09-01
description: >
  PHX-1102 hat das Gate ausgeliefert: Kanten, die feuern, zerfallen nicht mehr.
  Live auf einer Kopie des Founding-Mesh über zehn Runden tut es genau das —
  ~15.700 Kanten je Tick verschont, das stärkste Gewicht hält bei 0,905, wo der
  ausgelieferte Zerfall es auf 0,616 drückt.

  Und der Recall bewegt sich nicht. 84,8 % auf den benutzten, 82,2 % auf den
  zurückgehaltenen Fragen — identisch in Runde 0 und Runde 10, unter dem
  ausgelieferten Zerfall wie unter dem Gate. Kein Gold-Treffer hat sich bewegt.

  Die Wachstums-Variante (Gate + Hebb auf Doktrin-Skala, α=0,1) macht es nicht
  besser, sondern zeigt die Richtung der Pathologie: w_max sitzt ab Runde 2 an
  der Kappe, die benutzten Fragen bleiben bei Rang 27,4 → 27,5, die
  zurückgehaltenen fallen 82,2 → 80,0 % (Rang 30,3 → 31,0). Wachstum ohne
  Gewichtssummen-Kappe und Renormalisierung ist die Hub-Pathologie, nicht der
  Herzschlag.

  WARUM: der ausgelieferte Operator ist PPR über die zeilennormalisierte
  Adjazenz. Er liest Anteile, nicht Stärken. Zerfall w -> w(1-λw) ist je Knoten
  fast gleichförmig und damit unsichtbar; das Gate erzeugt in zehn Ticks ~15 %
  relativen Unterschied, was Reihenfolgen verschiebt (24/24) und keine
  Gold-Mitgliedschaft (Jaccard-Median 1,000).

  DREI BEDINGUNGEN, unter denen der Herzschlag messbar würde, jede mit Grund:
    1. Längerer Horizont — 50+ Ticks statt 10. Simulation billig, live ~1 min/Tick.
    2. Gewichtssummen-Kappe (MESH_SUBSTRATE §3) und Renormalisierung (§6), damit
       Wachstum die Verteilung verschiebt statt an w_max zu sättigen. Ohne beides
       ist jedes α > 0 auf Doktrin-Skala ein Pathologie-Erzeuger.
    3. Ein Instrument mit Spielraum. Auf dem Founding-Mesh nagelt k_seeds=1 mit
       Namensankern die Gold-Mitgliedschaft so fest, dass das Retrieval die
       Dynamik nicht braucht. Der Rang-Messer steht jetzt im Heartbeat-Skript;
       der Korpus muss einer sein, auf dem Recall nicht schon bei 85 % steht.

  Das Verb *lernt* aus "the mesh is alive" ist von *nein* zu *hält* gewandert,
  nicht zu *ja*.
resolution: >
  Auf 2WikiMultihopQA gemessen, wo das Retrieval Spielraum hat (SA@5 0,777 /
  0,813 gegen kNN 0,650 / 0,717): 150 benutzte / 150 zurückgehaltene Fragen,
  50 Runden, vier Politiken, im Speicher auf den echten Tick-Funktionen.

      Runde 50            used@5   held@5
      alter Zerfall        0,773    0,810
      Gate                 0,780    0,798
      Gate + Hebb α=0,01   0,790    0,798
      Gate + Hebb α=0,1    0,787    0,797

  DER HERZSCHLAG IST SICHTBAR: mit Gutschrift steigen die benutzten Fragen um
  +1,3 Punkte (Sprung in Runde 1, hält über 50). Das erste Mal, dass sich das
  Verb *lernt* auf einer Messung bewegt. UND DIE VERDRÄNGUNG AUCH: die
  zurückgehaltenen fallen unter dem Gate um −1,5, monoton über acht
  Messpunkte, mit oder ohne Gutschrift. 5,4 % der Kanten bleiben am Anschlag,
  alle anderen fallen auf 0,28; ihr Anteil je Knoten wächst um das 3,5-fache,
  und der Random Walk kippt zu den benutzten Regionen.

  Gleichmäßiger Zerfall ist auch hier fast unsichtbar (72 % Gewichtsverlust,
  −0,4 Punkte) — zweiter Korpus, dieselbe Aussage: der Operator liest Anteile.

  Von den drei Bedingungen sind zwei erfüllt (Horizont, Spielraum), und die
  dritte ist damit nicht mehr Argument, sondern Messung: ohne die globale
  Renormalisierung (MESH_SUBSTRATE §6) heißt „mehr Anteil für das Benutzte"
  „weniger für alles andere". → PHX-1106.

  Grenzen: 1–1,5 Punkte auf 150 Fragen sind ein bis zwei Fragen; die
  Arbeitssets waren wegen 56,8 % gleicher Gewichte nicht vollständig
  reproduzierbar (seit dem Lauf stabil sortiert); der Kern ist der des
  Benchmarks, nicht `mesh ask`. Volltext: docs/etappes/heartbeat_2wiki.md.
