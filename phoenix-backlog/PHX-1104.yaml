id: PHX-1104
category: substrate-runtime
priority: high
status: done
generation_target: MESH doctrine — "the mesh is alive", the verb *learns*
title: "The substrate now holds what it uses — and retrieval doesn't see it"
filed_by: Claude Code (2026-09-01, from the PHX-1102 heartbeat)
created_at: 2026-09-01
description: >
  PHX-1102 shipped the gate: edges that fire no longer decay. Live on a
  copy of the founding mesh over ten rounds it does exactly that —
  ~15,700 edges spared per tick, the strongest weight holds at 0.905, where
  the shipped decay pushes it down to 0.616.

  And recall doesn't move. 84.8% on the used, 82.2% on the held-out
  questions — identical in round 0 and round 10, under the shipped decay
  as under the gate. No gold hit has moved.

  The growth variant (gate + Hebb at doctrine scale, α=0.1) doesn't make it
  better, but shows the direction of the pathology: w_max sits at the cap
  from round 2 on, the used questions stay at rank 27.4 → 27.5, the
  held-out ones fall 82.2 → 80.0% (rank 30.3 → 31.0). Growth without a
  weight-sum cap and renormalisation is the hub pathology, not the
  heartbeat.

  WHY: the shipped operator is PPR over the row-normalised adjacency. It
  reads shares, not strengths. Decay w -> w(1-λw) is nearly uniform per
  node and therefore invisible; the gate produces ~15% relative difference
  in ten ticks, which shifts orderings (24/24) and no gold membership
  (Jaccard median 1.000).

  THREE CONDITIONS under which the heartbeat would become measurable, each
  with a reason:
    1. Longer horizon — 50+ ticks instead of 10. Simulation cheap, live
       ~1 min/tick.
    2. Weight-sum cap (MESH_SUBSTRATE §3) and renormalisation (§6), so that
       growth shifts the distribution instead of saturating at w_max.
       Without both, every α > 0 at doctrine scale is a pathology
       generator.
    3. An instrument with room to move. On the founding mesh, k_seeds=1
       with name anchors nails gold membership down so tightly that
       retrieval doesn't need the dynamics. The rank meter now sits in the
       heartbeat script; the corpus has to be one where recall isn't
       already at 85%.

  The verb *learns* from "the mesh is alive" has moved from *no* to
  *holds*, not to *yes*.
resolution: >
  Measured on 2WikiMultihopQA, where retrieval has room to move (SA@5
  0.777 / 0.813 against kNN 0.650 / 0.717): 150 used / 150 held-out
  questions, 50 rounds, four policies, in memory on the real tick
  functions.

      Round 50            used@5   held@5
      old decay             0.773    0.810
      Gate                  0.780    0.798
      Gate + Hebb α=0.01    0.790    0.798
      Gate + Hebb α=0.1     0.787    0.797

  THE HEARTBEAT IS VISIBLE: with credit, the used questions rise by +1.3
  points (jump in round 1, holds over 50). The first time the verb
  *learns* moves on a measurement. AND SO DOES THE DISPLACEMENT: the
  held-out ones fall under the gate by −1.5, monotonically over eight
  measurement points, with or without credit. 5.4% of edges stay at the
  ceiling, all others fall to 0.28; their share per node grows 3.5-fold,
  and the random walk tips toward the used regions.

  Uniform decay is nearly invisible here too (72% weight loss, −0.4
  points) — second corpus, same statement: the operator reads shares.

  Of the three conditions, two are met (horizon, room to move), and the
  third is thereby no longer an argument but a measurement: without the
  global renormalisation (MESH_SUBSTRATE §6), "more share for the used"
  means "less for everything else". → PHX-1106.

  Limits: 1–1.5 points on 150 questions are one or two questions; the
  working sets were not fully reproducible because of 56.8% equal weights
  (stably sorted since the run); the core is that of the benchmark, not
  `mesh ask`. Full text: docs/etappes/heartbeat_2wiki.md.
