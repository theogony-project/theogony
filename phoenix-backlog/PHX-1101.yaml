id: PHX-1101
category: substrate-runtime
priority: critical
status: done
generation_target: MESH migration — S5 (prerequisite)
title: "The substrate keeps no memory of its own activity"
filed_by: Claude Code (2026-08-31, from the doctrine inventory)
created_at: 2026-08-31
description: >
  `fired_total` and `fired_recent` are 0 on **every** node of the live substrate
  (measured over 5,002 consolidated nodes and a sample of 400 chunks)
  and have no writer anywhere in `src/`. `last_fired_at` is set at
  creation and never updated afterwards.

  This is not a minor matter, because four doctrine mechanisms read from it:

    - Tier promotion ("number of distinct activation contexts, age, breadth of
      incoming references") — which is why every node is `consolidation_tier` 1,
      and why PHX-1097 did not build it
    - tiered decay via `decay_tier`, which nothing can derive
    - Oneiros' replay, which lets "structurally important" edges fire even without
      a query, to protect the rare-but-important from superlinear decay
    - the eligibility traces of the three-factor RL

  On top of that: MESH_SUBSTRATE says "edges that **do not fire** weaken".
  `decay_edges_inplace` decays every edge unconditionally, because there is no
  firing signal for it to rely on.

  SCOPE: the read path writes back. `retrieve()` knows which nodes were
  activated — it builds the Constellation from them. One counter per activated
  node, buffered like the Hebbian deltas (the sidecar mechanism already exists)
  and folded in by the tick. The doctrine explicitly provides for this cost:
  MESH_IMPLEMENTATION §"Writes — buffered, not synchronous".

  CAUTION for the implementation: `fired_recent` is specified as a *rolling*
  counter; without a window it grows monotonically and becomes a second copy of
  `fired_total`. And the question of whether an anchor counts must be answered —
  source anchors are the highest-degree nodes of the mesh and would dominate any
  statistic.
resolution: >
  Built. The read path records, the tick folds in, and no Lance version moves
  during a read — `MESH_IMPLEMENTATION` §"What is forbidden" forbids reads that
  change the version being read, and names the buffer as the intended way.

  TWO SOURCES, as the doctrine describes them. (1) Retrieval: every node that
  reaches the working set has fired — that is "co-fires across many distinct
  activation contexts". (2) Ingestion: every reference to a node the substrate
  already had — MESH_SUBSTRATE §"Second worked example" says it in so many words
  ("fired_total and fired_recent increment"), and that is half of the
  "breadth of incoming references" of the promotion gate.

  MEASURED on a copy of the Founding mesh, 47 gold questions:

      Recording per query          0.219 ms median (max 0.366), sidecar 75.5 KB
      Tick without firings         4.42 s   (no node rewrite)
      Tick with firings            6.36 s   (+1.9 s on 5,002 nodes)
      get_consolidated afterwards  1.5 ms   (indices survive the overwrite)

      fired_total distinct        1  ->  32
      Peak                        Zeus 45, Theogony 43, source anchor 41,
                                  Phoebus Apollo 40, Cronos 39, Aphrodite 39

  DECISIONS, each with its reason:

  - **Source anchors count too.** The worry that they would turn the counter
    into a repeat of degree was measured and is false: they account for 5.6% of
    firing events, and Spearman(degree, firing count) is +0.459 with them against
    +0.439 without. Doctrine says anchors follow normal dynamics anyway.
  - **ON by default**, where the Hebbian write-back next to it is opt-in. The
    difference is what the write can change: a Hebbian delta moves an edge weight
    and thereby the next answer; a firing changes nothing a query can observe.
    And opt-in is exactly why the Hebbian path never fired in 14 ticks.
  - **The eval harnesses switch it off, now and not later.** Today a firing has
    no consequence for retrieval; as soon as tier promotion reads `fired_total`,
    a harness that records is measuring its own last run.
  - **One append per pass, not per node** — doctrine demands it literally
    ("a single append batch, not many small appends"), and the edge buffer next
    to it does the opposite (3.05 ms for 64 deltas).
  - **`fired_recent` floors instead of rounding.** At γ=0.9, `round(1*0,9)`
    equals 1 — a node that fired once would have kept the value forever and the
    field would never have forgotten anything. Found before shipping and pinned
    down with a test.

  LEFT OPEN, named rather than concealed: the fold rewrites the whole node
  table, 0.38 ms per node — on `data/mesh-wiki-100k` that would be ~38 s per tick
  with activity. A tick without firings costs nothing. And the window length of
  `fired_recent` (γ=0.9) has no measurement behind it; nothing reads the field
  yet.
