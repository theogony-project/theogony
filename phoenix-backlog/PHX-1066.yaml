id: PHX-1066
category: substrate-integrity
priority: high
status: done
generation_target: MESH migration — S2/S3
title: "93% of edges are asserted without judgement, under creation_contexts the doctrine does not list"
filed_by: Claude Code (measured on the named Theogony mesh, 2026-08-19)
created_at: 2026-08-19
description: >
  Nodes are committed through a graded identity decision — Q-ID, description,
  tag, or a new candidate, each with a corroboration threshold. Edges are not.
  Measured across the 94,490 edges of the named full read:

    kadmos_paragraph_density   53,122   56.2%   "co_mentions_in_paragraph"
    kadmos_cross_paragraph     18,689   19.8%   "shares_entities_with"
    kadmos_mentions             7,229    7.7%
    kadmos_relation             6,489    6.9%   <- the only judged relations
    kadmos_source_attribution   4,513    4.8%
    kadmos_paragraph_concept    2,036    2.2%
    kadmos_extraction           1,206    1.3%
    kadmos_source_hierarchy     1,206    1.3%

  Only `kadmos_relation` carries a relation the reading model actually asserted.
  Everything else says "these appeared near each other". The named relations that
  would answer the founding demo question are `father_of` (190), `mother_of`
  (183) and `son_of` (180) — 0.6% of the graph, against 53k proximity edges.

  DOCTRINAL DIVERGENCE: MESH_SUBSTRATE §Edge lists `creation_context` as
  `kadmos_extraction`, `oneiros_consolidation`, `argus_proposal`,
  `hebbian_co_fire`, `frame_routing`, `agent_repair`. Six of the eight contexts
  in use are not in that list, and the two largest — 76% of all edges — are bulk
  co-occurrence, a category the doctrine does not describe at all.

  MEASURED, AND THIS IS THE PART THAT ARGUES AGAINST A HASTY FIX: removing them
  does not change the answer. Gold recall on "Who are the children of Cronus?"
  against a 14-node proxy gold set:

    all edges                      94,490   3/14   ranks 1, 3, 19
    judged relations only           6,489   3/14   ranks 1, 2, 19
    everything except co-occurrence 41,368   3/14   ranks 1, 2, 25
    neither co-occ nor cross-para  22,679   3/14   ranks 1, 2, 25

  Dropping 93% of the graph moves two ranks and changes no counts. The answer is
  decided at seeding, not in propagation. Spreading activation is not idle — it
  fills 22 of every 30 constellation slots, measured identically across six
  questions — but what it fills them with is proximity, not relation.

  So there are two separate questions and they should not be conflated:

  (a) Should edges be asserted without judgement at all? On the doctrine's own
      terms, no: nodes get a graded identity decision and edges get none, and the
      contexts doing the asserting are not in the doctrine's vocabulary. This is
      a real divergence and worth resolving deliberately.

  (b) Would resolving it improve retrieval? On this corpus, measurably not. The
      demo question fails at seeding. Removing the unjudged edges is a
      correctness-and-doctrine argument, not a quality argument, and it should
      be made on those grounds rather than on a promise of better answers.

  Suggested order: decide (a) as a doctrine question — either the contexts get
  written into MESH_SUBSTRATE with their rationale, or the bulk co-occurrence
  pass gets a judging step. Do not motivate either by retrieval quality until a
  measurement supports it.

  ANSWERED 2026-08-20, against the PHX-1067 gold set and through the real
  pipeline. The retrieval argument is settled: DO NOT remove the co-occurrence
  edges. Split by question type, with name-anchored seeding active:

      variant            genealogical   narrative   other   overall
      all edges              58%           90%       89%      65%
      no co-occurrence       62%           80%       89%      67%

  Removing them helps genealogical questions by 4 points and costs narrative
  questions 10. The +2 aggregate hides both, and the gold set is 66%
  genealogical — shipping on the aggregate would have degraded narrative
  retrieval while reporting an improvement, with the bias concealing it.

  That is a better finding than the removal would have been: proximity is what a
  "why did X do Y" question needs, and typed relation is what "whose children
  are these" needs. Different question types want different views of the same
  graph. The lever is relation-type-aware propagation at query time, not a
  global edge policy — and today `relation_descriptor` is looked up only for
  display, never for propagation.

  DOCTRINE HALF DECIDED 2026-08-20 (delegated by the owner). MESH_SUBSTRATE
  §Edge now names two classes of `creation_context`:

    asserted relation  — something claimed a relation holds. kadmos_extraction,
                         oneiros_consolidation, argus_proposal, agent_repair.
                         These answer "what is true" and carry descriptors and
                         P-IDs.
    observed adjacency — the substrate recorded that two things occurred
                         together, with no claim of relation. The reading
                         contexts, plus hebbian_co_fire and frame_routing.
                         These answer "what came with what".

  The distinction was already in the doctrine unnamed: `hebbian_co_fire` sat in
  the list of contexts, and the surrounding text says such an edge "may have
  everything set to None — the topology has no semantic story to tell about why
  this co-firing happened". The reading path produces that same class in bulk;
  the six contexts it uses are now listed rather than absent.

  The reasoning that settles it is the project's own non-negotiable: the refusal
  of silent ungrounded insertion. Recording that two entities appeared in one
  paragraph is an observation and a true one — it is neither ungrounded nor
  silent, since the context names it exactly. What the value forbids is
  presenting an observation *as* an assertion, and naming the class is precisely
  what keeps that line visible. Gating the edges out would have discarded true
  observations to avoid a labelling problem, and cost narrative retrieval 10
  points for it.

  OLD REMAINDER, now addressed: six of eight
  `creation_context` values in use are absent from MESH_SUBSTRATE §Edge. They
  earn their place on the evidence above and should be written into the doctrine
  with that rationale, rather than gated out of the substrate.

