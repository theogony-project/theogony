description: >
  The MESH migration (Strangler-fig replacement of the Gen-1 substrate) is
  tracked by the six-step plan in MESH_MIGRATION_PLAN.md, plus one
  interpolated bootstrap step (S2.5) added 2026-05-15. This ticket is a
  meta-ticket for the migration's lifecycle; individual steps are their own
  PRs.
  Progress:
  - S1 (substrate skeleton): PR #149, merged 2026-05-13 ✅
  - S2 (Kadmos v2 ingestion): merged via #151 (initial eager linking +
    source-anchor entities) and #154 (dense paragraph topology +
    IngestRunReport) ✅
  - S2.5 (Wikidata5m bulk seed, interpolated bootstrap): tracked by PHX-1030.
    Smoke-1 PASS (#162), Smoke-2 (#164). The predicted `_edge_keys` dedup
    engpass (PHX-1033) is FIXED via a Lance edge_dedup_index (#165). Operator-
    driven subnets built and bge-m3-embedded: 10k (mesh-smoke2-safe), 15k
    (mesh-wiki-v1), 100k (mesh-wiki-100k, ~984k edges). Full 4.81M bootstrap
    blocked on a SeedConceptResolver RAM fix (100k OOM'd — the resolver caches
    full node vectors, ~50–100 KB/node). ✅ for smoke scales; ⏳ for full.
  - S3 (diversified-injection retrieval): retrieval-quality groundwork ACTIVE
    under PHX-1034. Eval harnesses landed (#166, #167). Measured: phase
    transition (SA > kNN past mean-degree ~3, gap widens with density),
    relation-conditioned propagation (MRR 0.110 → 0.254), Oneiros "dreaming"
    (+8.5% with no new data), PPR energy concentration (~4×). The full S3
    retrieval/ module (MMR + weight-class + sub-mesh + frame routing +
    constellation + `mesh ask`) is not yet built.
  - S4 (Cockpit/CLI/MCP backend abstraction): not started.
  - S5 (full Oneiros tick + MNLM training): not started. MNLM substrate-as-
    weights training is PHX-1035 (blocked on GPU, not effort).
  - S6 (legacy removal): not started.
  - Vision anchoring (World-Brain / MNLM-as-core / self-improvement central /
    implementation-as-proposal): #168, #169.
  - PHX backlog migration: MIGRATION_AUDIT.csv created 2026-05-13 ✅
