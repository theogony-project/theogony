id: PHX-1107
category: substrate-integrity
priority: critical
status: done
generation_target: MESH — substrate schema and Kadmos v2
title: "The substrate carries no memory of contradiction"
filed_by: Claude Code (2026-09-07, from the Plan from the Vision)
created_at: 2026-09-07
description: >
  The one finding from the vision ledger that determines the order. Of 258
  load-bearing claims in the vision documents, 61 are refuted; five of them
  are non-negotiables from PANTHEON_VISION §"Non-Negotiable Principles", and
  they fail not for lack of code but for lack of a data model:

      2  Contradiction, uncertainty, competing interpretations are preserved
         -> no representation of a contradiction, anywhere; `relation_kind`
            has ten values, none of them `contradicts`
      3  Time is intrinsic: change, supersession, expectation, decay
         -> only decay; `temporal_vector` is None on every node;
            no validity, no supersession
      1  every claim carries origin, basis, revision path
         -> provenance yes (alive again since PHX-1103), revision no:
            edges have neither trust nor author nor history
      5  authority, access, responsibility machine-readable
         -> no field for it, in no schema
      "Chronik instead of encyclopedia" -- the new, the contested, the superseded
         -> Gen 1 had DISPUTED as a status; the mesh no longer has it

  The MESH doctrine moved all of this into a single field: `frame_vector`, a
  node's epistemic stance. And `frame_vector` today is a salted SHA-256
  projection of the label (PHX-1095). The frame carries a hash, not a stance.

  This is the same finding as PHX-1101, one level up. There, the substrate
  carried no memory of its own activity, and everything that read from it
  could not run. Here it carries no memory of contradiction, and everything
  that would need to read it -- Athene, Chronos, the immune system, the
  Chronik, Metis, the second pillar "Scientific Workbench" -- cannot run. The
  verb *heals* is not merely unbuilt. It is unbuildable until the substrate
  knows what a contradiction is.

  Scope -- not the whole immune system, the precondition that every healing
  verb shares:

  1. Real frames. Kadmos emits an epistemic stance per chunk and per relation
     (asserted, negated, hypothetical, disputed, superseded); the vectorizer
     projects them into the 64-d frame space over a fixed basis instead of a
     hash. Frame routing thereby goes from inert to effective without
     changing a line of retrieval -- the mechanism has been waiting for its
     signal since S3.
  2. `contradicts` and `supersedes` as `relation_kind`, with `valid_from` /
     `valid_to` on the edge -- the smallest representation of time that
     satisfies Non-Negotiable 3. No new schema; the fields are free.
  3. A contradiction gold set on the founding corpus. Hesiod contradicts
     himself (the birth of Aphrodite, the parents of the Muses); Demo Beat 2
     has hinged on exactly such a question since PHX-1045.
  4. Re-read the founding corpus, with frames: 1 h 41 min, EUR 0.26 -- the
     cheapest path to a substrate that knows what it doubts.

  Done when: a contradiction question from the gold set returns both sides in
  the Constellation; frame routing on the newly-read mesh has a measurable
  effect (recall on the contradiction set, with versus without); and the verb
  *heals* has, for the first time, an input on which Athene could find
  something. Three to five sessions. Comes after PHX-1106, because a
  substrate that learns while displacing must first learn safely.
resolution: >
  Built and measured, 2026-09-12. Full text docs/etappes/contradiction.md.

  BUILT. (1) mesh/frames.py: seven epistemic axes, the doctrine's nine
  stances as points within them, query profiles. Factorised rather than
  enumerated, because a historical claim that was also refuted is both at
  once, and no list of seven labels can express that. Veridicality carries
  double weight, because negation is the reason the field exists. The cosine
  carries the doctrine's Kendall arithmetic: definition/current 0.98,
  historical 0.65, refuted -0.50 and thereby fully dampened. (2) Kadmos
  declares one stance per paragraph and per relation; chunks carry it,
  entities and anchors are neutral. (3) contradicts/supersedes as
  relation_kind, valid_from and valid_to on the edge, both in payload_json
  and thus without a migration. (4) frame_consistency is filled from the
  endpoints at ingestion. (5) runtime/contradiction.py: candidates found
  structurally, filtered by provenance (the same passage is an enumeration),
  then adjudicated. (6) runtime/frame_promotion.py: entities inherit the
  centroid of the frames of the paragraphs about them. (7) contradiction gold
  set with seven cases, each verified against both pieces of evidence in the
  corpus. (8) mesh ask --frame-profile: frame routing is reachable from
  outside for the first time (PHX-1095 called it "unreachable outside
  tests").

  RE-READ. 1,206 paragraphs, 2 h 27, EUR 0.39. The stances spread across
  eight values: current_claim 380, direct_quote 298, historical_claim 290,
  observation 111, definition 66, disputed 39, hypothesis 20, refuted_claim 2.
  The model wrote 30 contradicts relations itself while reading.
  frame_consistency carries something for the first time: 5,590 of 127,402
  edges below 1.0, 185 of them at exactly 0.

  THE PASS. 690 candidates, 74 confirmed, 334 edges, 141 paragraphs set to
  disputed. Real cases among them (Laomedon versus Tros as father of
  Ganymede, Theia versus Euryphaessa as mother of Eos and Selene), plus
  extraction noise. Two things were needed: descriptor normalisation
  (parenthood arrives in thirty spellings, half of them in the other
  direction -> 202 candidates instead of zero) and a two-stage adjudicator
  that first asks whether the relation even permits only one value (36 of
  100 confirmed -> 3 of 60).

  MEASURED, both-sides recall on seven contested questions:

      Mesh                         Profile         both sides
      old (hash frames)            any                71% (5/7)
      old (hash frames)            contradiction      29% (2/7)
      new, framed                  any                86% (6/7)
      new, framed                  contradiction      86% (6/7)

  The strongest finding is the second row: on the old mesh, the same routing
  costs 42 points, because it masks against a salted hash. PHX-1095 had
  suspected exactly that; this is the number for it.

  The ticket's condition, part 1 (a contradiction question returns both
  sides): met, 6 of 7. Part 3 (the verb *heals* has an input): met, 334
  contradicts edges and 141 flagged paragraphs on which Athene could find
  something. Part 2 (frame routing has a measurable effect): met, but only
  after inheritance and as a trade, not a gain — the contradiction profile
  gains the Helen question, where the corpus names the dispute itself, and
  loses the Moirai question, which is only structurally at odds. Before
  inheritance, all profiles were identical question for question.

  OPEN, named rather than hidden: the pass's precision (the 74 confirmations
  contain extraction noise such as fragment numbers); of the seven gold
  cases, the pass found only Aphrodite and Helen, and with different
  partners than expected; Works and Days is not included in this edition, so
  the Pandora and Ages-of-Man contrasts the ticket had assumed do not exist;
  the descriptor classes are curated and cover kinship, because this corpus
  is a genealogy.
