description: |
  Expand acquisition adapters beyond text: PDF parsing, image interpretation,
  handwriting recognition, voice-to-text, video analysis, forensic writing
  style analysis, and eventually physical library access.

  Every modality must produce provenance-anchored output. Ethical constraints
  around surveillance capabilities must be enforced through the digital twin
  classification system (observed, given, inferred, speculative, forbidden).
