id: PHX-1071
category: identity-integrity
priority: high
status: open
generation_target: MESH migration — S5 (consolidation)
title: "Aliases discovered at merge time are never persisted; referring expressions stay separate nodes"
filed_by: Claude Code (2026-08-20)
created_at: 2026-08-20
description: >
  The founding mesh holds at least six separate nodes for Zeus, under different
  primary names:

      tags=[Zeus, Jupiter, Jove]                  "Zeus — King of the gods..."
      tags=[son of Cronos, Zeus, Jupiter]         "son of Cronos — Zeus, the king..."
      tags=[father of men and gods, Zeus]         "father of men and gods — Zeus, who..."
      tags=[her father, Zeus, Jupiter, Jove]      "her father — Zeus, the father of Persephone..."
      tags=[Son of Chronos, Zeus, Jupiter]        "Son of Chronos — A reference to Zeus..."

  Every one of them says it is Zeus, in its own tags, and none of them was
  merged into the Zeus node. The linker's tag tier exists for exactly this and
  did not fire — its threshold is 0.55 and the descriptions of a referring
  expression and its referent are not that similar.

  A second, compounding half: `merge_identity_evidence` persists **only Q-IDs**,
  despite its docstring calling itself "identity evidence acquired at merge
  time". The eager linker calls
  `self._registry.remember(matched, aliases=[label, description], ...)` at every
  merge — and the registry is in-memory, discarded when the run ends. So a merge
  that discovers "this passage's 'the Earth-Shaker' is the node we call
  Poseidon" teaches the substrate nothing. The alias survives the paragraph and
  not the process.

  CORRECTS A CLAIM I MADE THE SAME DAY. Measuring duplicates keyed on the node's
  *primary* name found zero pairs sharing a name above cos 0.80, and I reported
  that the S5 deduplication pass had nothing to do. That measurement was too
  narrow: these nodes have different primary names and share an alias. Keyed on
  shared tags there are 250 groups.

  BUT THE 250 IS NOT A DUPLICATE COUNT, and the difference matters. Most of the
  largest groups are category tags, not aliases: "group" (13 nodes — heroes,
  those who voyage in ships, children of Zeus), "epic poem" (11 — Lesser Iliad,
  Aethiopis, Iliou Persis), "year" (8), "fragment" (7), "titan" (7). Those are
  distinct entities sharing a hypernym and must never be merged. The genuine
  alias groups are the ones where the shared tag is *some node's own primary
  name*: "hermes" (11), "apollo" (7). That discriminator is untested — it is a
  proposal for how to separate the two, not a measured criterion.

  WHY IT MATTERS FOR RETRIEVAL. This is the residual behind PHX-1064: a question
  naming Zeus seeds the Zeus node, and the passages attached to "son of Cronos"
  hang off a different node one hop further away. Recall at top_k=30 is 65%; the
  answers are reachable but not tight (PHX-1069).

  ORDER OF WORK, if taken up: persist aliases at merge time first. It is small,
  it is inside the doctrine (`merge_identity_evidence` already exists for
  exactly this purpose), and it changes what future reads can match on. Merging
  the existing fragments is the larger, riskier half and needs the
  alias-versus-category discriminator to be measured first — a merge pass that
  cannot tell "hermes" from "epic poem" would fuse the Little Iliad with the
  Aethiopis.

relates_to:
  - PHX-1064   # this is its residual, now with a mechanism
  - PHX-1065   # the same class: identity discarded at write time
  - PHX-1053   # merge_identity_evidence, which persists only half of what it is named for
linked_scripts:
  - src/theogony/mesh/ingestion/linker.py
  - src/theogony/mesh/storage/nodes.py
