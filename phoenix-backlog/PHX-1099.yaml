id: PHX-1099
category: substrate-retrieval
priority: high
status: done
generation_target: MESH migration — S3 (retrieval defaults)
title: "DEFAULT_K_SEEDS costs the answer arm six points"
filed_by: Claude Code (2026-08-31, from the PHX-1097 measurement)
created_at: 2026-08-31
description: >
  Measured while looking for something else, and larger than what was being
  looked for. On the unconsolidated founding mesh, `deepseek-chat`, three runs
  each, 47 gold questions:

      k_seeds   constellation answer recall   graph over prior knowledge
        5  (shipped)          53%                        +2
        1                     59%  [57-62]              +11

  The graph was contributing five times as much as the shipped default let it
  show. Retrieval says the same thing and said it first:

      k_seeds    recall    fully answered
        1         84%         36/47
        2         82%         35/47
        5         80%         38/47   <- shipped
        16        71%         33/47
        32        64%         27/47

  This is on the mesh **as it stands** — it is not a consequence of
  consolidation, and it reproduces on the consolidated mesh too (87% at k=1
  against 78% at k=5).

  PHX-1091 narrowed the default from 10 to 5 on a genealogical/narrative split.
  The sweep says it should have gone further. It also agrees with the HippoRAG
  seeding study (PHX-1089/1090), which found Spreading Activation's whole
  advantage lives at narrow seeding — +5.0 exact match at S=2 and nothing at
  S=10.

  NOT SHIPPED, because it is a production default and the evidence has one
  awkward edge: at k=5 the unconsolidated mesh answers 38/47 questions fully
  against 36/47 at k=1, so entity recall and complete-question count disagree
  there. On the consolidated mesh they agree (87% and 39/47 at k=1). Whether the
  default should follow whether consolidation has run is the question to settle.
resolution: >
  Shipped 2026-09-07: `DEFAULT_K_SEEDS = 1`, decided by the same tune/test
  protocol PHX-1091 used to set 5 -- choose k on one half of the gold set,
  report on the other, both directions, three shuffles -- because the
  protocol's answer changed when the substrate did. On the unconsolidated mesh
  k=1 lost held-out in 3 of 6 splits (-0.043/-2 full, -0.021/-2, -0.032/-2),
  which is why 5 was right then and why this ticket stayed measured_viable.
  On the consolidated mesh (PHX-1097, promoted to `data/mesh-founding` on
  2026-09-02) one seed is the entity rather than one of its fragments: k=1 is
  selected on the tune half in 6 of 6 splits and wins the held-out half in
  5 of 6, never losing recall (+0.092/+1, +0.087/0, +0.071/0, +0.109/+1,
  0.000/-1, +0.159/+2). Whole set: genealogical 0.747 -> 0.880, narrative
  0.861 -> 0.861. The pin in `test_retrieval_defaults.py` follows. Said
  plainly in the constant's comment: at k=1 weight-class stratification has
  no seats to allocate and is inert on this corpus; the mechanism stays built
  for callers that seed wider.
relates_to:
  - PHX-1091   # which set it to 5
  - PHX-1089   # the HippoRAG seeding study
  - PHX-1097   # where this was measured
