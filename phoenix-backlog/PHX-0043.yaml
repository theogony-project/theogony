id: PHX-0043
category: performance
priority: medium
status: open
generation_target: 1
title: "Async-pipeline IngestionPipeline writes against Neo4jKnowledgeStore"
filed_by: daedalus
created_at: 2026-04-19
description: |
  IngestionPipeline (Plan §2.5) currently writes nodes and edges
  to the store sequentially in the final Embedder/Persist stages.
  Against InMemoryKnowledgeStore that's free; against Neo4j every
  upsert is a Bolt round-trip (~1-3 ms LAN, ~10-30 ms WAN). At
  Gen-1 cardinality (~2000 nodes + ~2000 edges per book) that's
  4-12 s of pure round-trip latency on top of the LLM cost.

  Two complementary optimisations:
    A. Concurrent upserts within a stage (`asyncio.gather` over
       per-node-batches) — bounded by `Settings.store.max_concurrency`
       (new field, default 8; bolt driver tolerates this fine).
    B. Pipeline overlap: start writing already-resolved nodes
       while later sentences are still being LLM-extracted. This
       is structurally different from (A) — (A) is intra-stage
       parallelism, (B) is inter-stage pipelining.

  Acceptance:
    - Implement (A) only in this ticket; (B) is structural and
      belongs in a separate refactor PHX (file as a child if (A)
      proves insufficient).
    - Settings.store.max_concurrency added with sensible default
      and validator (1 ≤ value ≤ 32; >32 is bolt-pool foot-gun).
    - Smoke benchmark before/after on the same Hedin slice:
      target ≥ 3× speedup on the persist stage; reject if < 1.5×.
    - Do NOT add concurrency outside this stage in this ticket.
      Other stages (Wikidata client, NER, relation extraction)
      already have their own concurrency stories — touching them
      blurs the attribution of any speedup we observe.

  Out of scope:
    - PHX-0046 (batched UNWIND upserts) is the better answer if
      it lands. PHX-0043 only fires if PHX-0046 is rejected or
      deferred. Treat PHX-0046 as the preferred path; PHX-0043 is
      the fallback.

reopen_trigger: |
  PHX-0046 is rejected, deferred past Gen 1, or proves insufficient
  in measurement. Otherwise this ticket sleeps.

related:
  - PHX-0046  # batched UNWIND upsert — preferred alternative
  - PHX-0042  # read-side analogue
resolution: null
