[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theogony"
dynamic = ["version"]
description = "A living vector-graph knowledge network — separating knowledge from reasoning so that AI may serve humanity."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
requires-python = ">=3.12"
keywords = [
    "knowledge-graph",
    "rag",
    "ai",
    "llm",
    "graph-rag",
    "knowledge-base",
    "open-source",
    "vector-database",
    "memory",
    "agents",
    "mcp",
    "model-context-protocol",
    "provenance",
    "pantheon",
    "chronik",
]
authors = [
    {name = "Jakob Reinehr"},
]
maintainers = [
    {name = "Jakob Reinehr"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "sentence-transformers>=3.0.0",
    "spacy>=3.7.0",
    "python-dotenv>=1.0.0",
    "python-ulid>=2.2",
    "rich>=13.0.0",
    "typer>=0.12.0",
    # Used by the docs-aware ingest path (src/theogony/docs_ingest/) that
    # regenerates the bundled pantheon_self Chronicle seed. Small, pure
    # Python, no compiled deps; safe core dependency.
    "markdown-it-py>=3.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "lancedb>=0.6.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "openai>=1.0.0",
    # Pinned below 1.0: that major release swaps the SDK's HTTP dependency from
    # httpx to httpx2, and it type-checks the client it is handed — 0.96 rejects
    # an httpx2.AsyncClient, 1.0 rejects an httpx.AsyncClient, so no single choice
    # passes both. The tests' mocking layer (respx) also targets httpx, so the
    # break is wider than the type error it surfaces. Fourth dependency drift to
    # take CI red this week and the first that would have taken main with it;
    # the pinning strategy overall is an open decision (PHX-1076).
    "anthropic>=0.30.0,<1.0",
    # google-genai is mirrored from `gemini` so the test suite for
    # GeminiLLMProvider can `from google.genai import types` even
    # when the user has not installed the gemini extra. Cheap; the
    # SDK is small.
    "google-genai>=1.0.0",
    "testcontainers>=4.0",
    # MCP SDK so test_mcp_server.py runs inside the dev matrix without
    # forcing humans to install the optional ``mcp`` extra by hand.
    # 2.x replaced the lowlevel Server's decorator registration; the floor
    # is a major version so the next one cannot arrive unannounced.
    "mcp>=2.0.0,<3.0.0",
    # Import-linter for MNLM boundary enforcement (§3.6):
    # prevents text-generation imports from leaking into the MNLM module.
    "import-linter>=1.12",
]
gemini = [
    "google-genai>=1.0.0",
]
cockpit = [
    "markdown-it-py>=3.0.0",
]
openai = [
    "openai>=1.0.0",
]
anthropic = [
    # Pinned below 1.0: that major release swaps the SDK's HTTP dependency from
    # httpx to httpx2, and it type-checks the client it is handed — 0.96 rejects
    # an httpx2.AsyncClient, 1.0 rejects an httpx.AsyncClient, so no single choice
    # passes both. The tests' mocking layer (respx) also targets httpx, so the
    # break is wider than the type error it surfaces. Fourth dependency drift to
    # take CI red this week and the first that would have taken main with it;
    # the pinning strategy overall is an open decision (PHX-1076).
    "anthropic>=0.30.0,<1.0",
]
# Optional Model Context Protocol (MCP) server integration so any
# MCP-compatible host (Claude Desktop, Cursor, ChatGPT Desktop, Codex,
# etc.) can discover and call Theogony as a tool. Required for the
# ``theogony mcp`` CLI command.
mcp = [
    "mcp>=2.0.0,<3.0.0",
]
research = [
    "trafilatura>=1.12,<2.0",
]
# Optional dependencies for the mesh evaluation suite (scripts/mesh_*.py):
# trained KGE baselines, scaling-curve plots, and the LLM-as-judge probe.
eval = [
    "pykeen>=1.10",
    "matplotlib>=3.8",
    "anthropic>=0.40,<1.0",
]

[project.scripts]
theogony = "theogony.cli:app"

[project.urls]
Homepage = "https://github.com/theogony-project/theogony"
Documentation = "https://github.com/theogony-project/theogony/tree/main/docs"
Repository = "https://github.com/theogony-project/theogony"
Changelog = "https://github.com/theogony-project/theogony/releases"
"Bug Tracker" = "https://github.com/theogony-project/theogony/issues"
"Pantheon Vision" = "https://github.com/theogony-project/theogony/blob/main/docs/PANTHEON_VISION.md"

# --- Hatchling build configuration ---------------------------------------

# Single source of truth for the version: ``src/theogony/__init__.py``.
# ``__version__`` is parsed by hatchling at build-time so we never have
# to bump the same number in two places. The release workflow expects a
# git tag of ``v<version>`` matching what ``__version__`` already holds.
[tool.hatch.version]
path = "src/theogony/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/theogony"]

[tool.hatch.build.targets.wheel.force-include]
# PHX-0049: explicitly ship the AnswerSynthesizer system prompt with
# the wheel. Hatchling only auto-includes ``.py`` files inside the
# package; the ``.md`` data files need force-include or they vanish
# from non-editable installs and the synthesizer raises FileNotFoundError
# on first use.
"src/theogony/retrieval/prompts/answer_synthesizer.md" = "theogony/retrieval/prompts/answer_synthesizer.md"
# Same reason: the bundled pantheon_self Chronicle seed is a data file
# that hatchling would otherwise skip. Without the force-include,
# ``theogony seed`` would fail with FileNotFoundError on a fresh wheel
# install. Regenerate via ``python -m theogony.docs_ingest.regenerate``.
"src/theogony/seeds/pantheon_self.jsonl.gz" = "theogony/seeds/pantheon_self.jsonl.gz"
# PHX-1067: the founding-corpus gold set. Same trap as the two above — it is a
# .json inside the package, so hatchling skips it and `load_gold()` raises
# FileNotFoundError on a non-editable install.
"src/theogony/mesh/eval/gold/founding_corpus.json" = "theogony/mesh/eval/gold/founding_corpus.json"
# PHX-1072: the curated descriptor -> Wikidata property table. Same trap again.
"src/theogony/mesh/vocab/relation_pids.json" = "theogony/mesh/vocab/relation_pids.json"

[tool.hatch.build.targets.sdist]
# Source distribution: ship the package + the docs / prompts / phoenix
# backlog the package metadata references, plus the standard project
# files. Exclude transient artefacts (data/, dist/, etc. — those are in
# .gitignore but we double-belt them here so a fresh checkout sdist
# never accidentally bakes in a developer's local Neo4j data.)
include = [
    "src/theogony",
    "docs",
    "prompts",
    "phoenix-backlog",
    "tests",
    "scripts",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "PHILOSOPHY.md",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    ".env.example",
]
exclude = [
    "data/",
    "dist/",
    "build/",
    "venv/",
    ".venv/",
    "**/__pycache__",
    "**/*.pyc",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "neo4j_data/",
    "genesis_conversation_log.md",
    "cursor_theogony_project_introduction.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long prompt lines for the Topology Architect; wrapping hurts readability.
"src/theogony/extraction/topology_parser.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    """characterization: opt-in pipeline characterization runs (Plan §3.8 layer 6). \
Gated by both this marker and THEOGONY_RUN_CHARACTERIZATION=1 env var; \
consumes ~0.15-0.25 EUR Gemini per run.""",
    """living_demo: W7-W9 living-demo path smoke tests (Living Demo Plan). \
Truthful end-to-end checks for the demo loop; selectable via `pytest -m living_demo`. \
Must pass with InMemory store + StubLLM — no real services, no money spent.""",
    """live_anthropic: optional real Anthropic planner / web_search smoke (W11). \
Run locally with ANTHROPIC_API_KEY and THEOGONY_RUN_LIVE_ANTHROPIC=1; never enabled in CI.""",
]

# --- Import-linter contracts -----------------------------------------------
# MNLM boundary text enforcement (mesh_native_lm_brief.md §3.6):
# Forbid the MNLM module from importing any text-generation pipeline.
[tool.importlinter]
root_package = "theogony"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "MNLM no text generation"
type = "forbidden"
source_modules = ["theogony.agents.mnlm"]
forbidden_modules = ["transformers"]
