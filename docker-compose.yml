# Local development infrastructure (Plan §3.1a + E7 brief).
#
# `docker compose up neo4j` brings up the Neo4j 5.18-community container
# Theogony's `Neo4jKnowledgeStore` connects to. Defaults align with
# `Neo4jSettings` in `src/theogony/config/settings.py` (`bolt://localhost:7687`,
# user `neo4j`, password `neo4j`, database `neo4j`) so a fresh clone runs
# without any env-var tinkering.
#
# Production deployments override the password via THEOGONY_NEO4J__PASSWORD
# (SecretStr; never logged). Override the host port via NEO4J_BOLT_PORT
# in your shell if 7687 is already taken locally.

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: theogony-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"  # Bolt protocol (driver)
      - "${NEO4J_HTTP_PORT:-7474}:7474"  # HTTP (Browser UI at http://localhost:7474)
    environment:
      # Local dev: auth disabled. Neo4j 5.x rejects the literal "neo4j"
      # password (default-prevention), so the fresh-clone-no-env-tinkering
      # promise needs `NEO4J_AUTH=none`. Production overrides this via
      # docker-compose.override.yml or a managed deployment with
      # THEOGONY_NEO4J__PASSWORD set; production never runs auth-disabled
      # (Plan §3.6 secret discipline).
      NEO4J_AUTH: "none"
      # Memory settings sized for a developer laptop running one book's
      # worth of nodes/edges. Increase for sustained ingest workloads.
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
      NEO4J_server_memory_pagecache_size: "512m"
      # Accept the EULA non-interactively (community edition is freely
      # licensed; this just suppresses the startup prompt).
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - theogony_neo4j_data:/data
      - theogony_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  theogony_neo4j_data:
  theogony_neo4j_logs:
