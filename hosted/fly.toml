# Fly.io process + health checks for the MCP SSE service.
#
# Deploy from the repository root (Docker needs pyproject.toml + src/ in
# the build context). Fly's remote builder builds the image, pushes it
# to registry.fly.io, and rolls the machines:
#
#   fly deploy -c hosted/fly.toml --dockerfile hosted/Dockerfile --remote-only
#
# Or from repo root (canonical): `fly deploy` uses root `fly.toml`, which pins
# `[build].dockerfile = "hosted/Dockerfile"` so hatchling always sees `src/`.
#
# To deploy under a different app, change `app` below AND make sure the
# app exists (`fly apps create <name>`).

app = "theogony-mcp"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  # Generous grace_period: first request after cold-start triggers
  # sentence-transformer model load (~5-10 s on shared-cpu-1x).
  grace_period = "60s"
  method = "GET"
  path = "/health"

# 2 GB RAM gives comfortable headroom for sentence-transformer
# (~400 MB on first /sse connect) + the Iris cockpit aggregations
# (cluster summaries, depth-band distributions, report scans) which
# allocate small but non-trivial in-memory snapshots per request.
# 1 GB worked but was tight; 2 GB removes the OOM risk on hot cockpit
# traffic without changing the cost class meaningfully (~$4-5/month
# always-on shared-cpu-1x).
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
