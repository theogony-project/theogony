<div>
  <h2 class="text-lg font-medium text-amber-400">{{ node.label }}</h2>
  <p class="text-xs text-slate-400 mt-1">{{ node.id }} · {{ node.node_type.value }} · {{ node.layer.value }}</p>
  <p class="text-sm mt-2 text-slate-300">Confidence: {{ "%.2f"|format(node.scores.confidence) }}</p>
  <div id="hover-lupe"
       data-graph='{{ hover_lupe_data | tojson }}'
       class="w-full h-96 border border-slate-700 rounded mt-4"></div>
</div>
