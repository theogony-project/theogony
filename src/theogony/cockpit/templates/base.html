<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pantheon Cockpit{% endblock %}</title>
  <!-- Upgrade any insecure sub-resource the templates may emit. Belt-and-
       braces against the url_for HTTP/HTTPS scheme detection failing when
       Fly's TLS terminator forwards as plain HTTP to the Starlette host. -->
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <!-- Tailwind v3 Play CDN compiles utilities in-browser.
       crossorigin attribute removed: the CDN does not send the
       Access-Control-Allow-Origin header, which causes browsers to BLOCK
       the script entirely under the implied CORS policy. Plain script
       loads without crossorigin work. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="stylesheet" href="{{ url_for('cockpit_static', path='css/cockpit.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  {% include "partials/_navbar.html" %}
  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('cockpit_static', path='js/cockpit.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
