<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pantheon Cockpit{% endblock %}</title>
  <!-- Tailwind v3: no npm dist/min.css; Play CDN compiles utilities in-browser. -->
  <script src="https://cdn.tailwindcss.com" crossorigin="anonymous"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="stylesheet" href="{{ url_for('cockpit_static', path='css/cockpit.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.3" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  {% include "partials/_navbar.html" %}
  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('cockpit_static', path='js/cockpit.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
