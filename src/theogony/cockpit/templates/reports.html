{% extends "base.html" %}
{% block title %}Reports — Cockpit{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Run reports</h1>
<div hx-get="/cockpit/reports/query" hx-trigger="load" hx-target="#report-table">
  <nav class="flex flex-wrap gap-2 border-b border-slate-700 pb-2 text-sm">
    {% for slug, label in report_tabs %}
    <a href="#"
       class="text-slate-400 hover:text-amber-400 px-2 py-1 rounded hover:bg-slate-800"
       hx-get="/cockpit/reports/{{ slug }}"
       hx-target="#report-table">{{ label }}</a>
    {% endfor %}
  </nav>
  <div id="report-table" class="mt-4 text-sm"></div>
  <aside id="report-detail" class="mt-6 border border-slate-700 rounded p-3 bg-slate-950 min-h-[8rem]"></aside>
</div>
{% endblock %}
