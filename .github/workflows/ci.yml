name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'hosted/Dockerfile'
              - '.github/workflows/**'

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJson('["3.12"]') || fromJson('["3.12", "3.13"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache HuggingFace models (sentence-transformer + tokenisers)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-bge-small-en-v1.5-v1
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Cache spaCy English model
        uses: actions/cache@v4
        id: spacy-cache
        with:
          path: |
            ~/.cache/pip
            ~/.local/share/spacy
            ~/.local/lib/python${{ matrix.python-version }}/site-packages/en_core_web_sm
          key: spacy-${{ runner.os }}-${{ matrix.python-version }}-en_core_web_sm-v1

      - name: Install dependencies
        run: pip install -e ".[dev,research]"

      - name: Install spaCy English model
        run: python -m spacy download en_core_web_sm

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run serve subprocess smoke
        env:
          THEOGONY_TEST_SERVE: "1"
        run: pytest tests/cli/test_cli_serve_smoke.py -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format --check
        run: ruff format --check src/ tests/
