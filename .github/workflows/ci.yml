name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions needed by dorny/paths-filter@v3: pull-requests:read so it
# can call the listFiles API on PR triggers (it falls back to git diff
# on push triggers, which only needs contents:read). Locked to the
# minimum scopes — no write permissions on any resource.
permissions:
  contents: read
  pull-requests: read

# Cancel in-progress runs when a new commit is pushed to the same ref.
# Hugely effective on docs PRs that get rapid-fire fixups (small ruff
# format pushes, etc.) — without this, every fixup re-runs the whole
# matrix from scratch even though the previous run will be discarded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip the heavyweight Python + Neo4j jobs on docs-only PRs.
  # The `changes` job is < 5 seconds and gates the rest. If the PR
  # touches no Python / pyproject / Dockerfile paths, only `lint` runs
  # below. Docs-only PRs (the briefs, the PHX YAML files, the README
  # tweaks) become near-zero-cost CI.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      neo4j_relevant: ${{ steps.filter.outputs.neo4j_relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Conservative: any change under src/ or tests/ counts as code.
          # pyproject.toml + Dockerfile changes also force a full run.
          # Anything else (docs/, phoenix-backlog/, README.md, etc.) is
          # treated as docs-only and the heavy jobs are skipped.
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'hosted/Dockerfile'
              - '.github/workflows/**'
            neo4j_relevant:
              - 'src/theogony/stores/**'
              - 'src/theogony/core/store.py'
              - 'src/theogony/retrieval/**'
              - 'tests/test_store_contract.py'
              - 'tests/test_neo4j_store_live.py'
              - 'tests/test_retrieval_pipeline_neo4j_live.py'
              - 'tests/cli/test_cli_serve_smoke.py'
              - 'pyproject.toml'
              - '.github/workflows/**'

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        # On PRs run only 3.12 (matches the dev default + lint job).
        # On push to main run both 3.12 and 3.13 (full compat sweep).
        # Halves the test minutes on every PR with no compat-blind-spot.
        python-version: ${{ github.event_name == 'pull_request' && fromJson('["3.12"]') || fromJson('["3.12", "3.13"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache HuggingFace models (sentence-transformer + tokenisers)
        # Each fresh runner downloads BAAI/bge-small-en-v1.5 (~133 MB)
        # from HF Hub on first use. The model id is pinned via
        # Settings.embedding so the cache key is stable across runs.
        # Cache hit rate is ~95% in practice; cuts 30-60 s per run.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-bge-small-en-v1.5-v1
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Cache spaCy English model
        # `python -m spacy download en_core_web_sm` re-pulls the wheel
        # (~12 MB) on each run. Caching the install dir avoids the
        # network round-trip; key invalidates if the spaCy version in
        # pyproject changes (because cache also holds the metadata).
        uses: actions/cache@v4
        id: spacy-cache
        with:
          path: |
            ~/.cache/pip
            ~/.local/share/spacy
            ~/.local/lib/python${{ matrix.python-version }}/site-packages/en_core_web_sm
          key: spacy-${{ runner.os }}-${{ matrix.python-version }}-en_core_web_sm-v1

      - name: Install dependencies
        run: pip install -e ".[dev,research]"

      - name: Install spaCy English model
        # NerExtractor + IngestionPipeline tests load en_core_web_sm
        # (Plan §2.5). The pipeline tests in particular exercise real
        # NER on a fixture text, so the model must be present.
        run: python -m spacy download en_core_web_sm

      - name: Run tests
        # Default suite — Neo4j matrix is gated out; that lives in the
        # dedicated `neo4j` job below.
        run: pytest tests/ -v --tb=short

  neo4j:
    name: Neo4j store contract + live tests
    runs-on: ubuntu-latest
    needs: changes
    # Only run when something Neo4j-relevant actually changed. On
    # docs-only / cockpit-only / agent-only PRs this whole job is
    # skipped — saves ~3 minutes per such PR.
    if: needs.changes.outputs.neo4j_relevant == 'true'

    services:
      neo4j:
        image: neo4j:5.18-community
        ports:
          - 7687:7687
          - 7474:7474
        env:
          NEO4J_AUTH: none
        options: >-
          --health-cmd "wget -q -O - http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-bge-small-en-v1.5-v1
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e ".[dev,research]"

      - name: Install spaCy English model
        run: python -m spacy download en_core_web_sm

      - name: Run Neo4j-gated tests
        # ``THEOGONY_TEST_NEO4J=1`` enables the Neo4j parametrisation in
        # tests/test_store_contract.py and ungates the dedicated live
        # files (store, retrieval pipeline). testcontainers-python brings
        # up `neo4j:5.18-community` per session (cached). Expected
        # wall-clock add-on: ~30-60 s (Plan §3.8 budget). If the runner
        # cannot reach Docker / pull the image, set the env var to
        # anything other than 1 to skip the matrix; the failure is
        # surfaced in the dedicated job's logs without breaking the rest
        # of CI.
        env:
          THEOGONY_TEST_NEO4J: "1"
        run: |
          pytest \
            tests/test_store_contract.py \
            tests/test_neo4j_store_live.py \
            tests/test_retrieval_pipeline_neo4j_live.py \
            -v --tb=short

      - name: Run theogony serve subprocess smoke
        # Gated separately because subprocess + uvicorn is slow + flaky
        # on matrix runs. Linux-only; the lifespan is asyncio + uvicorn,
        # both well-tested upstream on Windows / macOS — no platform
        # matrix needed for E9.
        env:
          THEOGONY_TEST_SERVE: "1"
        run: pytest tests/cli/test_cli_serve_smoke.py -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Lint always runs — fast (< 30 s) and catches docs-formatting
    # issues that would otherwise fail at merge time.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format --check
        run: ruff format --check src/ tests/
